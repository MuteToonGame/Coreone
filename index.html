<!DOCTYPE html>
<html lang="th">
<head>
<script>window.onerror=function(m,u,l){alert('❌ ERROR บรรทัด '+l+':\n'+m)}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,viewport-fit=cover">
<title>Striker Football — Roguelite</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;900&family=Rajdhani:wght@600;700&family=Baloo+2:wght@700;800&display=swap');
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
}

img[src$="Maya2.webp"] {
  transform: scale(2) translate(0%, 30%) !important;
  transform-origin: bottom right;
}

svg, canvas {
  width: 100vw;
  height: 100vh;
  display: block;
}            
:root{--acc:#ffd54a;--acc2:#ff8a3d;--red:#ff3d5c;--blu:#4ea8ff;--cyan:#3df2ff;--grn:#3dffa0;--pink:#ff4ecd;--vio:#9b5cff;
 --metal:linear-gradient(155deg,#3a4048,#181c22 45%,#0a0c10);--glass:rgba(255,255,255,.055);
 --glow-acc:0 0 10px rgba(255,213,74,.6),0 0 30px rgba(255,213,74,.28);
 --glow-cy:0 0 10px rgba(61,242,255,.55),0 0 28px rgba(61,242,255,.25);
 --glow-pk:0 0 12px rgba(255,78,205,.55),0 0 30px rgba(155,92,255,.3);
 --ink:#160c1f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Rajdhani","Segoe UI",system-ui,"Noto Sans Thai",sans-serif;position:relative;background:
 radial-gradient(ellipse 90% 50% at 18% -8%,rgba(255,78,205,.16),transparent 55%),
 radial-gradient(ellipse 90% 55% at 88% 0%,rgba(61,242,255,.14),transparent 55%),
 radial-gradient(ellipse 140% 70% at 50% 120%,rgba(155,92,255,.16),transparent 60%),
 linear-gradient(165deg,#150a24,#0a0716 55%,#050308);
 color:#eaf6f0;min-height:100vh;display:flex;justify-content:center;padding:14px;overflow-x:hidden;overflow-y:auto}

#app{width:100%;max-width:840px;position:relative;z-index:1;display:block}
#app.show{display:block}
#err{position:fixed;top:0;left:0;right:0;background:#a01028;color:#fff;padding:8px 12px;font-size:12px;z-index:99;display:none}
.card{background:linear-gradient(155deg,rgba(255,255,255,.07),rgba(255,255,255,.02) 55%),var(--glass);
 border:1px solid rgba(255,255,255,.12);
 border-radius:16px 16px 16px 4px;padding:16px;margin-bottom:12px;position:relative;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 22px rgba(0,0,0,.4)}
.card::before{content:'';position:absolute;inset:0;border-radius:16px 16px 16px 4px;padding:1.5px;pointer-events:none;
 background:linear-gradient(140deg,rgba(255,255,255,.22),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 65%,rgba(255,78,205,.35));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.card::after{content:'';position:absolute;right:0;top:0;width:0;height:0;pointer-events:none;
 border-style:solid;border-width:0 16px 16px 0;border-color:transparent rgba(255,213,74,.5) transparent transparent}
h1{font-family:"Baloo 2","Kanit",sans-serif;font-size:29px;font-weight:800;color:var(--acc);letter-spacing:.5px;
 -webkit-text-stroke:1.6px var(--ink);paint-order:stroke fill;
 text-shadow:2px 3px 0 rgba(0,0,0,.5),var(--glow-acc)}
h2{font-family:"Baloo 2","Kanit",sans-serif;font-size:19px;font-weight:700;margin-bottom:10px;color:var(--acc);
 -webkit-text-stroke:.6px rgba(22,12,31,.7);paint-order:stroke fill;
 text-shadow:1px 2px 0 rgba(0,0,0,.4),0 0 8px rgba(255,213,74,.35)}
h3{font-size:15px;font-weight:700;margin:10px 0 6px;color:#9fe8c8}
button{font-family:"Rajdhani",inherit;cursor:pointer;border:none;border-radius:9px;padding:10px 14px;
 font-size:15px;font-weight:700;letter-spacing:.3px;background:linear-gradient(160deg,#1c8a6c,#0e5b45);
 color:#eafff6;transition:.15s;border:1.5px solid rgba(255,255,255,.22);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
 box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22)}
button:hover{filter:brightness(1.22) saturate(1.1);transform:translateY(-1px) scale(1.015)}
button:active{transform:translateY(1px) scale(.99)}
.onb-fab{
  position:fixed;
  top:calc(env(safe-area-inset-top,0px) + 255px);
  right:8px;
  z-index:48;
  padding:7px 12px;
  font-size:13px;
  font-weight:800;
  border-radius:10px;
  border:1.5px solid rgba(255,255,255,.5);
  cursor:pointer;
  font-family:"Rajdhani","Kanit",sans-serif;
  transition:.15s;
  box-shadow:0 3px 10px rgba(0,0,0,.55);
  background:linear-gradient(160deg,#2a3550,#151c30);
  color:#cfe0ff;
  letter-spacing:.3px;
}
.onb-fab.on{
  background:linear-gradient(160deg,#ffe58a,#ffd54a 55%,#e0a600);
  color:#231900;
  border-color:#fff;
  box-shadow:0 3px 14px rgba(255,213,74,.7);
  animation:onbPulse 1.6s ease-in-out infinite;
}
@keyframes onbPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
button:disabled{opacity:.35;cursor:not-allowed;filter:none;transform:none}
.btn-y{background:linear-gradient(160deg,#ffe58a,var(--acc) 55%,#e0a600);color:#231900;
 box-shadow:0 3px 0 rgba(0,0,0,.4),var(--glow-acc)}
.btn-r{background:linear-gradient(160deg,#ff5d7a,#c8324f 60%,#7a1830)}
.btn-g{background:linear-gradient(160deg,#6ab8ff,#4d8dff 55%,#1a4fc2)}
.row{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:8px}
.stagebg-caf15,.stagebg-caf68,.stagebg-caf910{background-color:#1a1410}
body.stagebg-caf15{--stg:url('Food15.webp')}
body.stagebg-caf68{--stg:url('Food68.webp')}
body.stagebg-caf910{--stg:url('Food910.webp')}
body[class*="stagebg-caf"] .card{background:rgba(12,8,18,.74)!important;backdrop-filter:blur(3px)}
.caf-menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.caf-item{padding:8px 10px}
.caf-item h3{font-size:13px;margin:0 0 4px;line-height:1.25}
.caf-item .small{font-size:11px;line-height:1.3;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.caf-item .btn-y{width:100%;padding:6px 8px;font-size:12px}
.stat{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.32);
 padding:8px 12px;border-radius:9px 9px 9px 2px;margin-bottom:6px;border:1px solid rgba(255,255,255,.08)}
.bar{height:20px;background:#0e0a16;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.22);
 box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ff3d5c,#ff8a3d,#ffe58a);
 transition:.35s;box-shadow:0 0 12px rgba(255,150,60,.7)}
.s9-timebar{height:8px;background:#0e0a16;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.18);margin-top:6px}
.s9-timebar>i{display:block;height:100%;background:linear-gradient(90deg,#3df2ff,#4dff9a);box-shadow:0 0 8px rgba(61,242,255,.6)}
.s9-timebar.late>i{background:linear-gradient(90deg,#ff3d5c,#ff8a3d);animation:s9LatePulse .5s ease-in-out infinite}
@keyframes s9Swap{0%{filter:brightness(2.1) contrast(1.1);scale:.9 1.1}55%{filter:brightness(1.25);scale:1.07 .95}100%{filter:none;scale:1 1}}
@keyframes s9LatePulse{0%,100%{opacity:1}50%{opacity:.45}}
.s9-jorun{position:absolute;left:42%;bottom:10px;height:130px;z-index:14;transform:translateX(-420%);animation:s9JoRunIn .75s cubic-bezier(.22,.85,.3,1) forwards;pointer-events:none}
.s9-jorun img{height:100%;width:auto;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
@keyframes s9JoRunIn{0%{transform:translateX(-420%)}70%{transform:translateX(8%)}100%{transform:translateX(0)}}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;
 background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);margin:2px;font-variant-numeric:tabular-nums}
.hero-avatar{width:56px;height:56px;border-radius:50%;overflow:hidden;border:2px solid var(--acc);
 background:linear-gradient(160deg,#241338,#0a0614);position:relative;flex-shrink:0;
 box-shadow:0 0 10px rgba(255,213,74,.35),inset 0 1px 0 rgba(255,255,255,.1)}
.hero-avatar svg{position:absolute;left:50%;top:50%;width:90px;height:112px;
 transform:translate(-50%,-42%);animation:none!important}
.hero-avatar svg .aur{display:none}
.act{flex:1;min-width:158px;text-align:left;line-height:1.45}
.acts-compact .act{padding:7px 10px;font-size:13px;line-height:1.25}
.acts-compact .act .small{font-size:10px}
.acts-compact .row{gap:6px}
.small{font-size:12px;opacity:.78}
#log{height:112px;overflow-y:auto;font-size:13px;line-height:1.6;background:rgba(0,0,0,.35);
 padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.06)}
#log div{border-bottom:1px dashed rgba(255,255,255,.08);padding:2px 0}
.ok{color:#67f5a8}.bad{color:#ff8a95}.gold{color:var(--acc);text-shadow:0 0 6px rgba(255,213,74,.4)}.info{color:#8fd0ff}
.modal{position:fixed;inset:0;background:rgba(5,3,10,.94);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.mbox{background:linear-gradient(165deg,#241338,#140a22 60%,#0a0614);border:1.5px solid rgba(255,255,255,.22);
 border-radius:18px 18px 18px 4px;padding:18px;max-width:840px;width:100%;max-height:92vh;overflow-y:auto;
 box-shadow:0 0 0 1px rgba(255,255,255,.06),0 24px 70px rgba(0,0,0,.65),var(--glow-pk)}
.cardpick{border-radius:12px 12px 12px 3px;padding:12px;cursor:pointer;border:2px solid rgba(255,255,255,.08);
 background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));transition:.15s;position:relative;overflow:hidden}
.cardpick::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.12) 50%,transparent 60%);
 transform:translateX(-120%);transition:transform .5s}
.cardpick:hover::after{transform:translateX(120%)}
.cardpick:hover{transform:translateY(-4px) scale(1.02);border-color:var(--acc);box-shadow:var(--glow-acc)}
.c-SPD{border-left:5px solid var(--acc)}.c-TEC{border-left:5px solid var(--blu)}
.c-PWR{border-left:5px solid #ff7a3d}.c-LUK{border-left:5px solid var(--red)}
.c-stat{border-left:5px solid #9b5cff}.c-help{border-left:5px solid var(--blu)}.c-risk{border-left:5px solid var(--red)}

.stagebtn{text-align:left;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));
 border:1.5px solid rgba(255,255,255,.18);border-radius:9px 9px 9px 2px}
.lock{opacity:.35}
 .next{border:2px solid var(--acc)}
@keyframes pul-lite{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.natbtn{display:flex;align-items:center;gap:6px;padding:8px 12px}
.swatch{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid rgba(255,255,255,.4)}
.statnum{font-family:"Kanit",sans-serif;font-weight:900;font-variant-numeric:tabular-nums}
.hpnum{font-family:"Kanit",sans-serif;font-weight:900;font-size:15px;text-shadow:0 0 8px rgba(255,90,90,.5)}
.chancebig{font-family:"Kanit",sans-serif;font-weight:900;font-size:17px;text-shadow:var(--glow-acc)}
.speechbox{background:linear-gradient(165deg,#2a1a3a,#150c22);border:1.5px solid rgba(255,180,80,.4);
 border-radius:16px 16px 16px 4px;padding:16px 18px;position:relative;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.55)}
.speechbox::before{content:'';position:absolute;left:26px;top:-9px;width:16px;height:16px;
 background:linear-gradient(165deg,#2a1a3a,#150c22);border-left:1px solid rgba(255,180,80,.4);
 border-top:1px solid rgba(255,180,80,.35);transform:rotate(45deg)}
.spkname{font-family:"Kanit",sans-serif;font-weight:900;color:var(--acc2);font-size:14px;letter-spacing:.4px}
.dlg-row{display:flex;align-items:flex-start;gap:9px;margin-top:12px}
.dlg-row:first-child{margin-top:0}
.dlg-row.dlg-r{flex-direction:row-reverse}
.dlg-av{flex:0 0 40px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 font-size:19px;background:#1a1226;border:2px solid rgba(255,180,80,.45);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.dlg-av-player{border-color:rgba(61,242,255,.5)}
.dlg-bubble{margin-top:0!important;flex:1}
.dlg-bubble::before{top:16px!important;left:-8px!important;width:14px!important;height:14px!important}
.dlg-row.dlg-r .dlg-bubble::before{left:auto!important;right:-8px!important}

.pitch{position:relative;height:250px;border-radius:16px 16px 16px 4px;overflow:hidden;cursor:pointer;user-select:none;contain:layout paint;
 background:
  radial-gradient(ellipse 75% 45% at 50% 4%,rgba(255,225,150,.28),rgba(255,180,120,0) 65%),
  radial-gradient(ellipse 60% 30% at 12% 0%,rgba(255,78,205,.22),transparent 70%),
  radial-gradient(ellipse 60% 30% at 88% 0%,rgba(61,242,255,.2),transparent 70%),
  linear-gradient(180deg,#0a0f2c 0%,#0d2c4a 12%,#0f3a3a 22%,#116b3e 30%,#1f9450 38%,#1c8248 55%,#186f3e 75%,#125c33 100%);
 border:1.5px solid rgba(255,255,255,.16);margin-bottom:12px;box-shadow:inset 0 0 60px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4)}
.crowd{position:absolute;top:0;left:0;width:300%;height:22%;
 background:
  repeating-linear-gradient(90deg,rgba(255,213,74,.13) 0 3px,transparent 3px 21px),
  repeating-linear-gradient(90deg,#264874 0 5px,#345a8c 5px 10px,#1c3258 10px 15px,#3f6aa0 15px 20px,#274a78 20px 25px,#4577b3 25px 30px);
 box-shadow:inset 0 -10px 14px -4px rgba(0,0,0,.55)}
.crowd::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 40px,transparent 40px 46px)}
.stand{position:absolute;top:19%;left:0;width:300%;height:4.5%;
 background:linear-gradient(180deg,#05070a,#0d1118);box-shadow:0 3px 8px rgba(0,0,0,.6)}
.mow{position:absolute;top:30%;left:0;width:300%;height:70%;
 background:repeating-linear-gradient(90deg,rgba(10,50,20,.3) 0 54px,rgba(20,80,40,.16) 54px 108px)}
.mowlines{position:absolute;top:30%;left:0;width:100%;height:70%;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 54px,transparent 54px 108px)}
.blades{position:absolute;top:30%;left:0;width:300%;height:70%;opacity:.5;
 background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 7px)}
.stripes{position:absolute;top:30%;left:0;width:300%;height:70%;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.075) 0 54px,transparent 54px 108px)}
.vignette{position:absolute;inset:0;z-index:6;pointer-events:none;
 background:radial-gradient(ellipse 90% 75% at 50% 55%,transparent 55%,rgba(0,0,0,.4) 100%)}
.hline{position:absolute;left:0;width:300%;height:3px;background:rgba(255,255,255,.22)}
@keyframes scr{to{transform:translateX(-108px)}}
.blades{display:none}
.pitch.spd-fast .mow{animation:scr 1.2s linear infinite}
.pitch.spd-mid .mow{animation:scr 1.6s linear infinite}
.pitch.spd-slow .mow{animation:scr 4s linear infinite}
.hero,.foe{position:absolute;bottom:10px;z-index:4}
.hero{left:10%}.foe{right:12%}
/* กองหลังวิ่งเข้าจากขวา */
@keyframes foeSlideIn{
  0%   { right:-42%; opacity:0; }
  12%  { opacity:1; }
  72%  { right:6%;  }
  88%  { right:15%; }
  100% { right:12%; opacity:1; }
}
.pitch.s-run.enterFoe .foe{
  animation:foeSlideIn 1s cubic-bezier(.22,.85,.3,1) forwards;
}
.pitch.s-run.enterFoe .foe .dsp{ animation:none; }
.foe-actions{position:absolute;left:82%;top:-85px;transform:translateX(-50%);display:flex;gap:7px;z-index:12;white-space:nowrap}
.foe-action{clip-path:none;width:38px;height:38px;padding:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:rgba(10,6,20,.9);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.45),0 0 10px rgba(255,78,205,.15);transition:transform .12s ease,background .12s ease,border-color .12s ease}
.foe-action:active{transform:scale(.88)}
.foe-action:hover{background:rgba(45,22,55,.96);border-color:rgba(255,215,90,.95)}
.foe-action small{display:block;font-size:8px;line-height:1;margin-top:2px;opacity:.82}
.hero .lean{transform:rotate(-5deg)}
.foe .mir{transform:scaleX(-1)}
/* ประตูอยู่นิ่ง ไม่ขยับตามตัวศัตรู: ตัวจริง .foe ไม่มีประตูแล้ว ใช้ตัวถือประตู (ซ่อนสไปรต์ ไม่รับแอนิเมชัน) */
.foe.goalhold{z-index:3;pointer-events:none;animation:none!important;translate:none!important;transition:none!important}
.foe.goalhold .mir{visibility:hidden;animation:none!important}
.goalpost{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:230px;height:170px;z-index:-1;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.foe .goalpost{transform:translateX(-50%) scaleX(-1)}
.chr{height:150px;width:auto;display:block;overflow:visible;will-change:transform}
.chr2d{height:150px;width:auto;display:block;object-fit:contain;image-rendering:auto}
.chr2d.kick{animation:heroKick2d .65s ease-in-out both}
@keyframes heroBob2d{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-3px) rotate(-1deg)}}
@keyframes heroIdle2d{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-2px) rotate(1deg)}}
@keyframes heroKick2d{0%{transform:rotate(0)}45%{transform:rotate(-3deg) translateY(-2px)}100%{transform:rotate(0)}}
.ghost{z-index:3;opacity:.30;filter:none}
.ball{position:absolute;left:calc(10% + var(--bx,100px));bottom:8px;width:25px;height:25px;z-index:5;will-change:transform}
.ball svg{width:100%;height:100%}
.shadow{position:absolute;bottom:6px;width:74px;height:12px;border-radius:50%;background:rgba(0,0,0,.32);z-index:2}
.shadow.h{left:calc(10% + 12px)}.shadow.f{right:calc(12% + 12px)}

.chr .j{transform-box:view-box}
@keyframes hipK{0%{transform:rotate(-42deg)}25%{transform:rotate(-6deg)}50%{transform:rotate(32deg)}75%{transform:rotate(4deg)}100%{transform:rotate(-42deg)}}
@keyframes kneeK{0%{transform:rotate(50deg)}25%{transform:rotate(10deg)}50%{transform:rotate(4deg)}75%{transform:rotate(74deg)}100%{transform:rotate(50deg)}}
@keyframes shdK{0%{transform:rotate(36deg)}50%{transform:rotate(-38deg)}100%{transform:rotate(36deg)}}
@keyframes elbK{0%{transform:rotate(-48deg)}50%{transform:rotate(-14deg)}100%{transform:rotate(-48deg)}}
@keyframes bobK{0%,100%{transform:translateY(0)}25%{transform:translateY(-7px)}50%{transform:translateY(0)}75%{transform:translateY(-5px)}}

@keyframes swayK{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
.chr.guard{animation:swayK 1.3s ease-in-out infinite}
.chr.guard .hipF{transform:rotate(-16deg)}.chr.guard .hipB{transform:rotate(17deg)}
.chr.guard .kneeF{transform:rotate(16deg)}.chr.guard .kneeB{transform:rotate(12deg)}
.chr.guard .shdF{transform:rotate(-52deg)}.chr.guard .shdB{transform:rotate(50deg)}
.chr.guard .elbF{transform:rotate(-28deg)}.chr.guard .elbB{transform:rotate(26deg)}
.aur{opacity:.5}
@keyframes aurK{from{opacity:.9}to{opacity:.2}}
@keyframes roll{to{transform:rotate(360deg)}}
.pitch.s-travel .ball,.pitch.s-run .ball,.pitch.s-fight .ball{animation:roll .5s linear infinite}

@keyframes drbHero{0%{left:10%;bottom:10px}28%{left:32%;bottom:40px}52%{left:50%;bottom:52px}78%{left:68%;bottom:16px}100%{left:76%;bottom:10px}}
@keyframes drbBall{0%{left:22%;bottom:8px}20%{left:40%;bottom:30px}42%{left:58%;bottom:26px}100%{left:95%;bottom:8px}}
@keyframes drbFoe{0%{transform:rotate(0)}30%{transform:rotate(-16deg) translateX(-12px)}52%{transform:rotate(20deg) translateX(16px)}76%{transform:rotate(-10deg)}100%{transform:rotate(5deg)}}

.stage-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 8px;
    margin-top: 8px;
}
.stagebtn-compact {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 6px 4px;
    text-align: center;
    transition: transform 0.15s, border-color 0.15s;
    cursor: pointer;
    aspect-ratio: 1 / 1;
    color: #eaf6f0;
}
.stagebtn-compact:not(:disabled):hover, 
.stagebtn-compact:not(:disabled):active {
    background: rgba(255, 255, 255, 0.08);
    border-color: var(--acc);
    transform: scale(1.03);
}
.stagebtn-compact.next {
    background: linear-gradient(160deg, rgba(255, 213, 74, 0.15), rgba(255, 213, 74, 0.02));
    border: 1.5px solid var(--acc);
    box-shadow: 0 0 12px rgba(255, 213, 74, 0.2);
}
.stagebtn-compact.lock {
    opacity: 0.35;
    cursor: not-allowed;
    background: rgba(0, 0, 0, 0.2);
}
.st-icon { font-size: 26px; line-height: 1; margin-bottom: 6px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

.st-name { font-size: 13px; font-weight: 800; line-height: 1.1; word-break: break-word; }
.st-stars { font-size: 10px; color: var(--acc); margin-top: 4px; letter-spacing: -1px; }
.video-screen {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 1;
}

  width: 100%;
  height: 100%;
  object-fit: cover;      
  background: #000;
}

function checkDrop(){
 if(!R)return;
 const luk=eff().luk;
 const roll=Math.random()*100;
 let acc=0;

 acc += 1.5 + luk*0.02;
 if(roll < acc){
  const pool=ITEMS.filter(i=>i.rarity==='rare' && !itemOwned(i.id));
  if(pool.length){
   const it=pool[Math.floor(rnd(pool.length))];
   R.giftQueue=R.giftQueue||[];
   R.giftQueue.push(it);
   log('⚔️ พบ '+it.icon+' '+it.n+' — จะได้รับตอนจบด่าน','info');
   return;
  }
 }

 acc += 0.8 + luk*0.01;
 if(roll < acc){
  const pool=ITEMS.filter(i=>i.rarity==='epic' && !itemOwned(i.id));
  if(pool.length){
   const it=pool[Math.floor(rnd(pool.length))];
   R.giftQueue=R.giftQueue||[];
   R.giftQueue.push(it);
   log('💎 พบ '+it.icon+' '+it.n+' — จะได้รับตอนจบด่าน','gold');
   return;
  }
 }

 if(legendUnlocked()){
  acc += 0.4;
  if(roll < acc){
   const pool=LEGEND_ITEMS.filter(i=>!itemOwned(i.id));
   if(pool.length){
    const it=pool[Math.floor(rnd(pool.length))];
    R.giftQueue=R.giftQueue||[];
    R.giftQueue.push(it);
    log('🌟 พบไอเทมลับ '+it.icon+' '+it.n+' — จะได้รับตอนจบด่าน!','gold');
    return;
   }
  }
 }

 acc += 25 + luk*0.20;
 if(roll < acc){
  const b=BUFFS[Math.floor(rnd(BUFFS.length))];
  applyBuff(b);
 }
}

function bodyClass(w){
  w = (w == null) ? 70 : w;
  for(let i = 0; i < 4; i++){ if(w < statGet('zone.' + ZONE_ORDER[i])) return ZONE_ORDER[i]; }
  return 'fat';
}

function bodyBonusText(w){
  const c = bodyClass(w), f = BODY_MODS[c] || {}, p = BODY_PCT[c] || {};
  const sg = n => (n>0?'+':'')+n;
  return ['str','agi','dex','vit'].map(k => {
    const a = f[k]||0, b = p[k]||0;
    if(!a && !b) return '';
    return k[0].toUpperCase()+k.slice(1)+' '+sg(a)+' ('+sg(b)+'%)';
  }).filter(Boolean).join(' · ');
}

function bodyLabel(w){
  const c = bodyClass(w);
  if(c === 'vthin')  return '💀 ผอมมาก';
  if(c === 'thin')   return '🏃 ผอม';
  if(c === 'fit')    return '⚖ พอดี';
  if(c === 'stocky') return '💪 ล่ำ';
  return '🐘 อ้วน';
}

function eatFood(k){
  const f = FOOD_MENU.find(x => x.k === k);
  if(!f) return;
  if((S.mp||0) < f.cost){ log('เงินไม่พอซื้อ ' + f.n, 'bad'); scrCafeteria(); return; }
  S.mp -= f.cost;

  if(!S.body) S.body = {w:70};
  const isUnder40 = S.body.w < 40;

  // บรรทัดนี้แหละครับที่หายไป ทำให้ปีกกาไม่ครบคู่
  if(f.gamble){
    if(f.gamble === 'somtam'){
      if(Math.random() < .4){
        S.body.w = Math.max(0, S.body.w - 12);
        S.somtamBuff = {agi:8, vit:-5, stage:(S.unlocked||1)};
        log('🌶 ส้มตำแจ็คพอตแตก! ท้องเสียขี้แตก วิ่งหนีเข้าห้องน้ำ วิ่งไวขึ้นชั่วคราว · น้ำหนัก −12', 'gold');
      } else {
        S.body.w = Math.max(0, S.body.w + 1);
        log('🌶 กินส้มตำเฉยๆ เผ็ดจี๊ดหน่อย · น้ำหนัก +1', 'info');
      }
    }
    if(f.gamble === 'mookata'){
      if(Math.random() < .3){
        S.body.w = Math.max(0, S.body.w - 2);
        log('🔥 หมูกะทะไหม้เกรียม กินไม่ลง · น้ำหนัก −2', 'bad');
      } else {
        S.body.w = Math.max(0, S.body.w + 12);
        log('🔥 หมูกะทะเต็มคราบ อิ่มแปล้ · น้ำหนัก +12', 'gold');
      }
    }

    for(const st in f.st){
      if(st === 'hp') dietAdd('hp', f.st.hp);
      else if(!isUnder40) dietAdd(st, f.st[st]);
    }
  } else {
    S.body.w = Math.max(0, S.body.w + (f.dw || 0));
    if(isUnder40){
      log('🍽 กิน '+f.icon+' '+f.n+' (น้ำหนัก '+(f.dw>=0?'+':'')+f.dw+') ⚠️ ผอมเกินไป (<40) ร่างกายไม่ดูดซึม Stat!', 'bad');
    } else {
      for(const st in f.st){
        if(st === 'hp') dietAdd('hp', f.st.hp);
        else dietAdd(st, f.st[st]);
      }
      log('🍽 กิน '+f.icon+' '+f.n+' (น้ำหนัก '+(f.dw>=0?'+':'')+f.dw+')', 'ok');
    }
  }

  CAF_OFFERS = CAF_OFFERS.filter(x => x.k !== k);
  if(typeof save === 'function') save();
  scrCafeteria();
}

function onbAutoHandleModal(){
 // เบรกกะทันหัน — เลือกท่าที่โอกาสสูงสุด
 const retry=[...document.querySelectorAll('.modal')].find(m=>/เบรกกะทันหัน/.test(m.textContent));
 if(retry){
  const btns=[...retry.querySelectorAll('button.act:not(.el-locked)')];
  if(btns.length){
   let best=btns[0],bc=-1;
   btns.forEach(b=>{
    const mm=b.textContent.match(/(\d+(?:\.\d+)?)\s*%/);
    const c=mm?parseFloat(mm[1]):0;
    if(c>bc){bc=c;best=b}
   });
   best.click();
  } else retry.querySelector('button.btn-r')?.click();
  return true;
 }
 // (ก) เลือกการ์ด — สุ่ม 5 ใบแรกที่มี
 if(document.querySelector('.draft-modal')){
  if(!R.pickedIdx)R.pickedIdx=new Set();
  let g=0;
  while(R.pickedIdx.size<5&&g++<20){
   let added=false;
   for(let i=0;i<DRAFT.length;i++){
    if(!R.pickedIdx.has(i)){R.pickedIdx.add(i);added=true;break}
   }
   if(!added)break;
  }
  refreshDraft();
  if(R.pickedIdx.size>=5)setTimeout(()=>{if(document.querySelector('.draft-modal'))confirmPicks()},180);
  return true;
 }
 // สรุปแจกการ์ดอัตโนมัติ
 if(document.querySelector('.ad-modal')){closeAutoDealSummary();return true}
 // คู่มือท่าชนะทาง
 if(window.__tgNext){closeTypeGuide();return true}
 // พักครึ่ง → นอนพัก
 if(MIDNEXT){midEventRest();return true}
 // ปุ่มข้ามของฉากก่อนด่าน
 const sk=document.querySelector('.s2p-skip,.s7-skip,.s8-skip,.s9-skip,.s10-skip,.s11-skip');
 if(sk){sk.click();return true}
 // ฉากก่อนด่านแบบ pm-ov
 if(document.querySelector('.pm-ov')){if(window.pmTap)window.pmTap();return true}
 return false;
}

  const gain = Math.max(1, Math.round(cur * pct / 100));
  addMod({stat:key, v:gain});
  return gain;
}

  const x=typeof m.v==='function'?m.v():m.v;
  (m.op==='mul'?muls:m.op==='postAdd'?posts:adds).push({m:m,x:x});
 }
 adds.forEach(function(a){v+=a.x;if(tr)tr.push({ขั้น:'add',แหล่ง:a.m.src,หมวด:a.m.cat,ค่า:a.x,สะสม:v})});

 return v;

function calc(k,charged){
 const a=ACTIONS[k],e=curEnemy(),s=eff();
 const E=Math.max(1,a.eff(s)),D=Math.max(1,e.str);
 let c=50+50*((E-D)/(E+D))*CFG.SLOPE;
 c+=s.luk*CFG.LUCK_B;
 if(!e.gk){if(a.adv===e.type)c+=CFG.TYPE;else if(a.weak===e.type)c-=CFG.TYPE}
 if(!e.gk&&e.no<=3)c+=CFG.WARM[e.no-1];
 if(!e.gk&&S6_WALL_ACT[e.img])c+=(k===S6_WALL_ACT[e.img]?PW_BONUS:-PW_BONUS);
 if(isSlideStage()&&R.s9Late)c-=20;
 if(R.lastAct===k&&R.streak>=2){
  if(k==='TEC' && S.legendActive==='kaiRebound'){
  } else {
   const rebFatMul=(S.legendActive==='kaiRebound' && k!=='TEC')?2:1;
   c-=CFG.FATIGUE*(1-gearFatiguePct())*rebFatMul;
  }
 }
 if(R.reckless)c+=22;
 if(R.lastHope&&R.hp<maxHp()*.3)c+=20;
c+=Math.min(CFG.RETRY_CAP,R.attempts*CFG.RETRY_BONUS);
c+=missStreakBonus(R.missStreak);

 if(R.counterAttack && R.lastActMissed) c+=25;
 if(R.fullPowerCrit && s.str > e.str) c+=25;
 if(R.readGame && !e.gk && a.adv===e.type) c+=20;
 if(R.tacticActive && R.lastAct!==k) c+=15;

 if(k==='DRB'&&charged&&driftOn())c+=SD_BONUS;
 if(k==='PWD'&&charged&&buffaloOn())c+=BC_BONUS;
  if(k==='TEC'&&charged)c+=ZC_BONUS;
 if(R.stage === 0) { c = 95; }
 
  if(R.zeroGravity) {
   const bc = bodyClass(_wt());
   if(bc === 'vthin' || bc === 'thin') c += 10;
 }

 c=Math.min(CFG.MAX,Math.max(CFG.MIN,c));
 if(R.coinFlip)c=50;
 if(R.allIn&&R.hp<maxHp()*.2)c=100;
 if(k==='DRB' && R.aceDRB) c=99;
 return{chance:Math.round(c*10)/10,enemy:e,act:a}
}

function dmgOf(k){
 const e = curEnemy();
 const vit = eff().vit || 0;

 // 1. ดาเมจตั้งต้น (ใช้ sqrt เพื่อไม่ให้พุ่งเกินตอน str สูง)
 const raw = CFG.DMG_BASE + Math.sqrt(e.str) * CFG.DMG_SQRT;

 // 2. ลดเป็น % (1 vit = 1% · cap 80% กันอมตะ)
 const pctRed = 1 - Math.min(80, vit) / CFG.DMG_VIT_PCT;
 let dmg = raw * pctRed;

 // 3. ลดแบบ flat (1 vit = -0.3)
 dmg -= vit * CFG.DMG_VIT_FLAT;

 // 4. modifier ของการ์ด
 if(R && R.zeroGravity) {
   const bc = bodyClass(_wt());
   if(bc === 'vthin' || bc === 'thin') dmg *= 2;
 }

 return Math.max(1, Math.round(dmg));
}

 const nm = b.who==='gump'

   : b.who==='say'
     ? _pn

 return `<div class="gbub ${c.cls}" style="animation-duration:${b.dur}ms;animation-delay:${-el}ms"><div class="gb-av">${av}</div><div class="gb-box"><b>${nm}</b>${PN(b.text)}</div></div>`}
function bubbleClear(){
 clearTimeout(BUB_T);BUB_T=null;BUB_Q=[];BUB_DONE=null;
 if(R){R.bubble=null;R.bubTalk=false}
 const e=document.querySelector('.gbub');if(e)e.remove()}
function bubbleNext(){
 clearTimeout(BUB_T);BUB_T=null;
 if(!R||R.over){BUB_Q=[];return}
 const it=BUB_Q.shift();
 const old=document.querySelector('.gbub');if(old)old.remove();
 if(!it){R.bubble=null;const dn=BUB_DONE;BUB_DONE=null;
  if(dn){R.bubTalk=false;dn();return}
  if(R.bubTalk){R.bubTalk=false;R.busy=false;scrBattle()}return}
 if(it.key&&!s1Seen(it.key))s1Mark(it.key);
 const dur=Math.min(4600,1500+it.text.length*50);
 R.bubble={who:it.who,text:it.text,label:it.label,at:Date.now(),dur};
 const p=document.querySelector('.pitch');
 if(p)p.insertAdjacentHTML('beforeend',bubbleHTML(R.bubble));
 BUB_T=setTimeout(bubbleNext,dur+120)}
function bubbleSay(list,done){BUB_Q=list.slice();BUB_DONE=done||null;bubbleNext()}
function bubbleAlive(){return !!(R&&R.bubble&&Date.now()-R.bubble.at<R.bubble.dur)}
function bubbleAdd(item){if(bubbleAlive())BUB_Q.push(item);else bubbleSay([item])}
function bubbleTap(){if(!R||!R.bubTalk)return false;if(R.bubble&&Date.now()-R.bubble.at<250)return true;bubbleNext();return true}

let SD=null;
const SD_WAVE='M0 20 L14 20 L20 12 L26 28 L32 20 L52 20 L58 8 L66 34 L72 20 L100 20 L106 14 L112 26 L118 20 L140 20 L146 6 L154 36 L160 20 L200 20';
function sdDown(e){
 if(e&&e.cancelable)e.preventDefault();
 if(SD||ZC||!guard()||!availableActs().includes('DRB')||!driftOn())return;
 const tut=isDriftStep(),w=tut?.2:SD_ZONE_W,z0=tut?.62:(.42+Math.random()*(.92-w-.42));
 SD={t0:performance.now(),z0,z1:z0+w,raf:0,pid:e?e.pointerId:0,buzz:false};
 window.addEventListener('pointerup',sdUp);
 window.addEventListener('pointercancel',sdAbort);
 const tt=document.getElementById('itemToast');if(tt)tt.remove();
 document.querySelectorAll('.sd-btn').forEach(b=>b.classList.add('hold'));
 sdTick()}
 
function sdBuild(){
 const pt=document.querySelector('.pitch');if(!pt||!SD)return;
 pt.querySelectorAll('.sdGauge').forEach(x=>x.remove());
 pt.insertAdjacentHTML('beforeend',`<div class="sdGauge"><svg viewBox="0 0 200 40" preserveAspectRatio="none"><path class="sdWave" d="${SD_WAVE}"/></svg><i class="sdZone" style="left:${(SD.z0*100).toFixed(1)}%;width:${((SD.z1-SD.z0)*100).toFixed(1)}%"></i><i class="sdCur"></i><span class="sdTx">NEURAL WAVE · ปล่อยตอนเข้าโซนทอง!</span></div>`)}

function sdTick(){
 if(!SD)return;
 if(!R||R.over||R.busy){sdAbort();return}
 const p=Math.min(1,(performance.now()-SD.t0)/SD_MS);
 
 if(!SD.el || !document.body.contains(SD.el)){
  let g=document.querySelector('.pitch .sdGauge');
  if(!g){sdBuild();g=document.querySelector('.pitch .sdGauge')}
  SD.el=g;
 }
 let g=SD.el;
 
 if(g){
  const inZ=p>=SD.z0&&p<=SD.z1;
  g.style.setProperty('--sd',(p*100).toFixed(1)+'%');
  g.classList.toggle('in',inZ);g.classList.toggle('end',p>=1);
  if(inZ&&!SD.buzz){SD.buzz=true;if(navigator.vibrate)navigator.vibrate(18)}}
 SD.raf=requestAnimationFrame(sdTick)}

function sdClear(){
 document.querySelectorAll('.sd-btn').forEach(b=>b.classList.remove('hold'));
 document.querySelectorAll('.sdGauge').forEach(g=>g.remove())}
function sdStop(){
 if(!SD)return null;
 cancelAnimationFrame(SD.raf);
 window.removeEventListener('pointerup',sdUp);window.removeEventListener('pointercancel',sdAbort);
 const z=SD;SD=null;sdClear();return z}
function sdUp(e){
 if(!SD||(e&&e.pointerId!==SD.pid))return;
 const z=sdStop();if(!z||!guard())return;
 const p=Math.min(1,(performance.now()-z.t0)/SD_MS),perfect=p>=z.z0&&p<=z.z1;
 if(perfect&&!isDriftStep())showToast('🌫️ SHADOW DRIFT! +'+SD_BONUS+'%','buff');
 doAct('DRB',false,perfect)}

function sdAbort(){sdStop()}

function s11mFightIntro(){
 if(!R||R.over||R.s11Intro===R.idx)return;
 R.s11Intro=R.idx;
 const L=S11M_PRE[R.idx];if(!L)return;
 if(S11M_FX[R.idx])s11mFx(S11M_FX[R.idx]);
 R.bubTalk=true;R.busy=true;scrBattle();
 bubbleSay(L.map(s11mMk),()=>{if(!R||R.over)return;R.bubTalk=false;R.busy=false;scrBattle()})}

function s11mOnPass(){
 const k=R.idx;
 if(R.s11PostDone===k)return false;
 R.s11PostDone=k;
 const post=S11M_POST[k];if(!post)return false;
 const holo=(k>=1&&k<=11);
 const go=()=>{if(!R||R.over)return;R.busy=true;R.bubTalk=true;R.scene='fight';R.flash=null;if(holo)R.s11FoeGone=true;scrBattle();
  bubbleSay(post.map(s11mMk),()=>{if(!R||R.over)return;R.bubTalk=false;onPass()})};
 R.busy=true;
 const f=holo?document.querySelector('.pitch .foe'):null;
 if(f){f.classList.add('s11dis');TIMER=setTimeout(go,700)}else go();
 return true}
function s11mAfterPass(){
 const n=R.idx;R.s11FoeGone=false;
 if(n>=15)return s11mFinale();
 const cont=()=>{if(!R||R.over)return;R.bubTalk=false;R.busy=false;const sc=(R.idx===5);maybeShowMidEvent(()=>{sc?drawCards():encounter()})};
 if(n===13||n===14){R.busy=true;R.scene='travel';R.flash=null;scrBattle();return s11mFlashback(n===13?'A':'B',cont)}
 cont()}

function s11gChance(){let c=70;try{const r=calc('DRB',false);if(r&&typeof r.chance==='number')c=r.chance}catch(e){}return Math.max(0,Math.min(100,c))}
function s11gBaseZone(){let c=70;try{const r=calc('DRB',false);if(r&&typeof r.chance==='number')c=r.chance}catch(e){}
 return Math.min(S11G_ZONE_MAX,Math.max(S11G_ZONE_MIN,c*.45/100))}
function s11gBeat(v){try{ACTX=ACTX||new (window.AudioContext||window.webkitAudioContext)();if(ACTX.state==='suspended')ACTX.resume();
 [0,.14].forEach((d,k)=>{const t=ACTX.currentTime+d,o=ACTX.createOscillator(),g=ACTX.createGain();o.type='sine';o.frequency.setValueAtTime(k?52:64,t);o.frequency.exponentialRampToValueAtTime(34,t+.12);
  g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime((k?.28:.42)*(v||1),t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(ACTX.destination);o.start(t);o.stop(t+.2)})}catch(e){}}
const s11gAlive=()=>!!(R&&!R.over&&R.s11g);
function s11gUI(){
 const el=document.createElement('div');el.className='s11g';
 el.innerHTML='<div class="s11g-vig"></div><div class="s11g-pop"></div>'
  +'<div class="s11g-box"><div class="s11g-rd"><b></b><b></b><b></b></div><div class="s11g-bar"><div class="s11g-fill"></div><div class="s11g-zone"></div><div class="s11g-cur"></div></div><div class="s11g-hint">[ กดค้างเพื่อรวบรวมสมาธิ ]</div></div>';
 document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('on'));
 const q=s=>el.querySelector(s);
 const up=()=>s11gUp();
 window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
 el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}s11gDown()});
 el.addEventListener('contextmenu',e=>e.preventDefault());
 return{el,
  showGauge(){q('.s11g-box').classList.add('on')},
  hint(t,go){const h=q('.s11g-hint');h.textContent='[ '+t+' ]';h.classList.toggle('go',!!go)},
  pop(t,ok){const p=q('.s11g-pop');p.classList.remove('on','ok');void p.offsetWidth;p.textContent=t||'';if(ok)p.classList.add('ok');if(t)p.classList.add('on')},
  jo(){},
  round(i,n){q('.s11g-rd').querySelectorAll('b').forEach((b,k)=>{b.className=k<n?'done':(k===i?'cur':'')})},
  zone(zs,w){const z=q('.s11g-zone');z.style.left=(zs*100)+'%';z.style.width=(w*100)+'%';z.classList.remove('lit')},
  lit(on){q('.s11g-zone').classList.toggle('lit',!!on)},
  cur(p){const v=(Math.min(1,Math.max(0,p))*100)+'%';q('.s11g-cur').style.left=v;q('.s11g-fill').style.width=v},
  live(on){el.classList.toggle('live',!!on)},
  run(on){el.classList.toggle('run',!!on)},
  close(){window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);el.classList.remove('on','live');setTimeout(()=>el.remove(),420)}}}
function s11gRound(i,done){
 if(!s11gAlive())return;
 const g=R.s11g,w=s11gBaseZone()/S11G_ROUND_DIV[i],zs=.45+Math.random()*Math.max(.02,(.9-w)-.45);
 Object.assign(g,{i:i,done:done||g.done||0,zs:zs,w:w,st:'idle',cued:false,raf:0});
 const u=g.ui;u.round(i,g.done);u.zone(zs,w);u.cur(0);u.jo(false);u.pop('');u.run(false);u.lit(false);
 u.hint('กดค้างเพื่อรวบรวมสมาธิ');u.live(true);
 showToast('🎯 รอบ '+(i+1)+' / 3 — '+(i===0?'ยากเท่าเลี้ยงหลบปกติ':i===1?'โซนแคบลง ×2':'โซนแคบลง ×2 ของรอบ 2'),'buff')}
function s11gDown(){
 if(!s11gAlive())return;const g=R.s11g;if(g.st!=='idle')return;
 g.st='run';g.t0=performance.now();g.nextBeat=0;g.cued=false;g.warned=false;
 g.pitch=document.querySelector('.pitch');g.foe=document.querySelector('.pitch .foe');g.pw=g.pitch?g.pitch.clientWidth:360;
 g.ui.run(true);g.ui.hint('รอให้มันเข้าใกล้ที่สุด...');g.ui.pop('');
 g.raf=requestAnimationFrame(s11gTick)}
function s11gTick(now){
 if(!s11gAlive())return;const g=R.s11g;if(g.st!=='run')return;
 const p=(now-g.t0)/1000/S11G_TRAVEL,pc=Math.min(1,p),u=g.ui;
 u.cur(pc);if(g.foe)g.foe.style.translate=(-g.pw*.52*pc)+'px 0';
 if(now>=g.nextBeat){s11gBeat(.5+pc*.6);g.nextBeat=now+(760-440*pc)}
 if(!g.warned&&!g.cued&&p>=Math.max(.12,g.zs-.28)){g.warned=true;try{bubbleSay([{who:'jo',text:['ใกล้แล้ว! เตรียมหลบ!','เกือบถึงแล้ว! ตั้งสติ!','รอบสุดท้าย! อย่าพลาด!'][g.i||0]}])}catch(e){}}
 if(!g.cued&&p>=g.zs){g.cued=true;u.pop('ตอนนี้แหละ!! โยกหลบดิ๊โว้ยยย!!');u.hint('ปล่อยนิ้วเพื่อหลบ!!',true);u.lit(true);try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}}
 if(g.cued&&p>g.zs+g.w)u.lit(false);
 if(p>=1)return s11gJudge('late');
 g.raf=requestAnimationFrame(s11gTick)}
function s11gUp(){
 if(!s11gAlive())return;const g=R.s11g;if(g.st!=='run')return;
 const p=(performance.now()-g.t0)/1000/S11G_TRAVEL;
 s11gJudge(p<g.zs?'early':(p<=g.zs+g.w?'ok':'late'))}

function s11gJudge(kind){

 let pct=null;

 if(kind==='ok'){
  g.done++;u.round(g.i,g.done);u.jo(true);u.pop('สวย! สเต็ปนรกของมึงกลับมาแล้ว!',true);

  const hero=document.querySelector('.pitch .hero');if(hero)hero.classList.add('s11gDodge');
  showToast('🌀 หลบสำเร็จ '+g.done+' / 3 — กดถูก + สุ่มผ่าน ('+Math.round(pct)+'%) HP ไม่ลด','buff');
  TIMER=setTimeout(()=>{
   if(!s11gAlive())return;
   if(g.done>=3)return s11gWin();
   R.scene='fight';R.flash=null;scrBattle();s11gRound(g.i+1)},1700);
  return}
 u.jo(false);u.pop(kind==='roll'?'กดถูกแล้ว แต่ขาไม่ตามทัน!!':kind==='early'?'เฮ้ย!! เร็วไป!!':'เฮ้ย!! ช้าไป!!');
 if(kind==='roll')showToast('🎲 กดถูกจังหวะ แต่สุ่มไม่ผ่าน ('+Math.round(pct)+'%) — HP ลด','miss');
 R.hp=Math.max(0,R.hp-Math.max(1,Math.round(maxHp()*S11G_FAIL_DMG)));R.winStreak=0;
 R.scene='fail';R.blkLoss=false;R.taunt=null;R.flash={t:'โดนเต็มๆ!',s:kind==='roll'?'กดถูก แต่โอกาสหลบ '+Math.round(pct)+'% ไม่ผ่าน':kind==='early'?'ปล่อยนิ้วเร็วไป':'ปล่อยนิ้วช้าไป',c:'f-fail'};
 scrBattle();setTimeout(()=>spawnFX('fail'),80);s11mFx('gear',700);
 TIMER=setTimeout(()=>{
  if(!s11gAlive())return;
  if(R.hp<=0){u.close();R.s11g=null;R.s11Slow=false;R.busy=false;return endRun()}
  R.scene='fight';R.flash=null;scrBattle();s11gRound(g.i)},1700)}

function s9TimerMs(){

let S9T=null;
function s9TimerStop(){if(S9T){cancelAnimationFrame(S9T.raf);S9T=null}}
function s9TimerStart(){
 s9TimerStop();
 if(R){R.s9FoeTx=null;R.s9LungePose=false}
 if(!R||!isSlideStage())return;
 const ms=s9TimerMs();if(!ms)return;
 R.s9Late=false;S9T={t0:performance.now(),ms,raf:0,g:null};
 try{const e=curEnemy();new Image().src='Def'+((e&&e.img)||(R.stage+1))+'2.webp'}catch(_){}
 
 s9TimerTick()}
function s9TimerTick(){
 if(!S9T||!R||R.over||R.busy||R.scene!=='fight'){S9T=null;return}
 const p=Math.min(1,(performance.now()-S9T.t0)/S9T.ms);
 const bar=document.querySelector('.s9-timebar>i');
 if(bar)bar.style.width=(Math.max(0,1-p)*100)+'%';
 if(p<1)s9FoeAnim(p);
 if(p>=1){const g=S9T.g||s9FoeGeom();S9T=null;return s9TimeoutHit(g)}
 S9T.raf=requestAnimationFrame(s9TimerTick)}
function s9TimeBarHTML(){
 return'';
 if(!isSlideStage()||!R||R.scene!=='fight')return'';
 const pct=R.s9Late?0:(S9T?Math.max(0,100*(1-(performance.now()-S9T.t0)/S9T.ms)):100);
 return `<div class="s9-timebar${R.s9Late?' late':''}"><i style="width:${pct}%"></i></div>`}

const S9_SPLIT=.55;
const s9HoldScene=()=>!!(R&&isSlideStage()&&R.s9FoeTx!=null&&/^(w|fail$|blk$)/.test(R.scene||''));
const s9HoldStyle=()=>s9HoldScene()?' style="translate:'+R.s9FoeTx.toFixed(1)+'px"':'';
function s9FoeGeom(){
 const pitch=document.querySelector('.pitch'),foe=pitch&&pitch.querySelector('.foe'),hero=pitch&&pitch.querySelector('.hero');
 if(!foe||!hero)return null;
 const prev=foe.style.translate;foe.style.translate='none';
 const pr=pitch.getBoundingClientRect(),fr=foe.getBoundingClientRect(),hr=hero.getBoundingClientRect();
 foe.style.translate=prev;
 return{sx:pr.right-fr.left+12,ex:(hr.left+hr.width*.6)-fr.left}}
function s9FoeAnim(p){
 if(!R||R.phase==='gk')return;
 const foe=document.querySelector('.pitch .foe');if(!foe)return;
 const g=S9T.g||(S9T.g=s9FoeGeom());if(!g)return;
 let tx,lunge=false;
 if(p<S9_SPLIT){const q=p/S9_SPLIT;tx=g.sx*Math.pow(1-q,2)}
 else{const q=(p-S9_SPLIT)/(1-S9_SPLIT);tx=g.ex*q*q;lunge=true}
 foe.style.translate=tx.toFixed(1)+'px';R.s9FoeTx=tx;R.s9LungePose=lunge;
 const sh=document.querySelector('.pitch .shadow.f');if(sh)sh.style.translate=tx.toFixed(1)+'px';
 if(lunge){
  const img=foe.querySelector('.dimg'),e=curEnemy(),n=(e&&e.img)||(R.stage+1),norm='Def'+n+'.webp';
  if(img&&img.getAttribute('src')===norm){img.onerror=function(){this.onerror=null;this.src=norm};img.src='Def'+n+'2.webp';img.style.animation='s9Swap .24s ease-out'}}}
function s9TimeoutHit(g){
 if(!R||R.over||R.busy||R.scene!=='fight')return;
 R.busy=true;R.s9Late=true;if(g){R.s9FoeTx=g.ex;R.s9LungePose=true}
 const dmg=dmgOf('SKIP');
 if(R.shield>0){R.shield--;log('🛡 โล่กำบังรับไว้! กองหลังพุ่งชนแต่ดาเมจ 0 (เหลือ '+R.shield+')','ok')}
 else{R.hp-=dmg;log('🐌 หลบไม่ทัน! กองหลังพุ่งชน −'+dmg+' HP → เหลือ '+Math.max(0,R.hp),'bad')}
 const dead=R.hp<=0;
 R.scene='fail';R.flash={t:'หลบไม่ทัน!',s:dead?'หมดแรงแล้ว...':'กองหลังพุ่งชน — กดใหม่!',c:'f-fail'};scrBattle();
 if(g){const f=document.querySelector('.pitch .foe');if(f)f.style.translate=g.ex.toFixed(1)+'px'}
 setTimeout(()=>spawnFX('fail'),80);
 TIMER=setTimeout(()=>{if(!R||R.over)return;
  if(dead){R.busy=false;return endRun()}
  R.scene='fight';R.busy=false;R.flash=null;R.s9Late=false;scrBattle();s9TimerStart()},1400)}

function s9LowHpFate(){

 R.s9BossPick=['Boss92.webp','Boss94.webp','Boss95.webp'][Math.floor(Math.random()*3)];

 if(R.shield>0){R.shield--;log('🛡 โล่กำบังรับไว้! ดาเมจ 0 (เหลือ '+R.shield+')','ok');
  R.scene='fail';R.flash={t:'BLOCKED!',s:'Le Juge อ่านเกมขาด — ต้องหาทางอื่น',c:'f-fail'};scrBattle();
  setTimeout(()=>spawnFX('fail'),80);

 if(R.hp>S9_SAFE_HP){

  dmg=Math.max(dmg,S9_MIN_DMG);
  const before=R.hp;R.hp=Math.max(S9_SAFE_HP,R.hp-dmg);dmg=before-R.hp;
 }else R.hp-=dmg; // HP <= 30: ดาเมจจริง ตายคือตาย
 if(R.hp<=0){
  R.hp=0;
  log('💀 ผู้ตัดสินอ่านเกมขาด! ท่า '+ACTIONS[k].n+' ใช้ไม่ได้ผล −'+dmg+' HP → หมดแรง','bad');

  setTimeout(()=>spawnFX('fail'),80);
  TIMER=setTimeout(()=>{if(!R||R.over)return;R.busy=false;endRun()},1400);
  return}
 if(R.hp<=S9_ONEONE_HP){
  log('🔥 ผู้ตัดสินอ่านเกมขาด! −'+dmg+' HP → เหลือ '+R.hp,'bad');
  R.scene='fail';R.flash={t:'HP '+R.hp+'!',s:'Le Juge หยุดนิ่ง...',c:'f-fail'};scrBattle();
  TIMER=setTimeout(()=>{if(!R||R.over)return;R.scene='fight';R.flash=null;R.s9Late=false;scrBattle();s9LowHpFate()},1400);
  return}
 log('🔥 ผู้ตัดสินอ่านเกมขาด! ท่า '+ACTIONS[k].n+' ใช้ไม่ได้ผล −'+dmg+' HP → เหลือ '+R.hp,'bad');

   const plays=s6gPlays()+1;
   S.story.s6GachaPlays=plays;
   S.story.s6GachaIntro=true;S.story.s6GachaUnlocked=true;

    if(plays>=S6G_MAX&&!itemOwned('mayaheart'))S.gearOwned.push('mayaheart');
   }

   window.__s6gGiftImg=isFirstCow?'Buff1.webp':'Buff.webp';

   TIMER=setTimeout(()=>{
    const m=document.querySelector('.s6g-modal');if(m)m.remove();window.__s6g=null;

let c12Step = -1;


const C12_EDIT = false;
const C12_POS_KEY = 'striker_c12_pos_v1';
const C12_EL_ID = { coach:'c12CoachPose', maya:'c12MayaPose', gum:'c12GumPose', box:'c12DialogueBox', bcoach:'c12BubbleCoachPos', bmaya:'c12BubbleMayaPos', bgum:'c12BubbleGumPos' };
const C12_LOCKED_POS = {
  coach:{dx:0,dy:0,sc:1}, maya:{dx:0,dy:0,sc:1}, gum:{dx:0,dy:0,sc:1}, box:{dx:0,dy:0,sc:1},
  bcoach:{dx:85.44026947021484,dy:60.16632843017578,sc:1.48},
  bmaya:{dx:-93.553466796875,dy:-27.00937271118164,sc:1.4},
  bgum:{dx:-79.50242614746094,dy:33.67154312133789,sc:1.32}
};
let C12_DRAG = null;
function c12Stored(){ let o={}; try{ o=JSON.parse(localStorage.getItem(C12_POS_KEY)||'{}')||{} }catch(e){} return o; }
function c12Pos(key){ const o=c12Stored(); return o[key]||C12_LOCKED_POS[key]||{dx:0,dy:0,sc:1}; }
function c12SetPos(key,patch){
  const o=c12Stored(); o[key]=Object.assign(c12Pos(key),patch);
  try{ localStorage.setItem(C12_POS_KEY,JSON.stringify(o)); }catch(e){}
}
function c12ApplyPos(){
  Object.keys(C12_EL_ID).forEach(key=>{
    const el=document.getElementById(C12_EL_ID[key]); if(!el) return;
    const p=c12Pos(key);
    el.style.transform = 'translate('+p.dx+'px,'+p.dy+'px) scale('+p.sc+')';
  });
}
function c12ResetPos(){
  try{ localStorage.removeItem(C12_POS_KEY); }catch(e){}
  c12ApplyPos();
}
function c12CopyPos(){
  const o={}; Object.keys(C12_EL_ID).forEach(key=>o[key]=c12Pos(key));
  const txt='[Ca12] '+JSON.stringify(o);
  const done=()=>{ if(typeof showToast==='function') showToast('📋 คัดลอกตำแหน่ง/ขนาดแล้ว! วางส่งในแชทได้เลย','gold'); };
  const fail=()=>{ try{ window.prompt('คัดลอกข้อความนี้ส่งในแชท:',txt); }catch(e){} };
  try{ navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(txt).then(done).catch(fail) : fail(); }catch(e){ fail(); }
}
function c12Down(e,key){
  if(!C12_EDIT) return;
  e.stopPropagation();
  const p=c12Pos(key);
  C12_DRAG={key,sx:e.clientX,sy:e.clientY,odx:p.dx,ody:p.dy,moved:false};
  const el=document.getElementById(C12_EL_ID[key]); if(el) el.classList.add('c12-dragging');
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
  window.addEventListener('pointermove',c12Move);
  window.addEventListener('pointerup',c12Up);
}
function c12Move(e){
  if(!C12_DRAG) return;
  const dx=e.clientX-C12_DRAG.sx, dy=e.clientY-C12_DRAG.sy;
  if(!C12_DRAG.moved && Math.hypot(dx,dy)<4) return;
  C12_DRAG.moved=true; window.__c12DragMoved=true;
  c12SetPos(C12_DRAG.key,{dx:C12_DRAG.odx+dx,dy:C12_DRAG.ody+dy});
  c12ApplyPos();
}
function c12Up(){
  window.removeEventListener('pointermove',c12Move);
  window.removeEventListener('pointerup',c12Up);
  if(C12_DRAG){ const el=document.getElementById(C12_EL_ID[C12_DRAG.key]); if(el) el.classList.remove('c12-dragging'); }
  C12_DRAG=null;
}
function c12NudgeScale(key,d){
  const p=c12Pos(key), sc=Math.max(.4,Math.min(2.2,+(p.sc+d).toFixed(2)));
  c12SetPos(key,{sc}); c12ApplyPos();
}

    const place = (el, p) => { el.style.left = p.x + '%'; el.style.bottom = (p.y || 0) + '%'; el.style.height = p.h + '%'; };

    function setChar(id, p) {
      let c = chars[id];
      if (p === null) {
        if (c) { const el = c.el; delete chars[id]; el.classList.add('out'); setTimeout(() => el.remove(), 500); }
        return;
      }
      if (!c) {
        const el = document.createElement('div'); el.className = 's11-ch ' + id;

      world.classList.remove('push'); world.classList.toggle('dark', !!s.dark);
      spot.classList.remove('on'); stage.classList.remove('practice');
      if (s.scan) { scan.classList.remove('go'); void scan.offsetWidth; scan.classList.add('go'); }
      if (s.set) Object.keys(s.set).forEach(id => setChar(id, s.set[id]));
    }

    const FX = {
      shout(d) { const c = chars[d.on || d.k]; if (c) pop(c.el, 'shout'); },
      jolt(d) { const c = chars[d.on || d.k]; if (c) pop(c.el, 'jolt'); },
      stop() { stage.classList.remove('practice'); if (chars.gump) chars.gump.el.classList.remove('practice'); },
      push() { world.classList.remove('push'); void world.offsetWidth; world.classList.add('push'); },
      spot() { pop(flash, 'go'); world.classList.remove('dark'); spot.classList.add('on'); }

    function render() {
      const d = SCRIPT[idx]; if (!d) return;

        auto = true; box.classList.remove('show');
        dip(() => applyScene(d.scene), d.scene.title, d.scene.small, () => { auto = false; idx++; render(); });

      if (d.fx && FX[d.fx]) FX[d.fx](d);
      if (d.dir) { focus(null); box.className = 's11-box dir show'; box.innerHTML = '[ ' + PN(d.dir) + ' ]'; return; }

      const go = () => { stage.style.transition = 'opacity .4s'; stage.style.opacity = '0'; setTimeout(() => { wrap.remove(); if (typeof next === 'function') next(); }, 420); };
      if (delay) { box.classList.remove('show'); letter.classList.remove('on'); phone.classList.remove('on'); stage.classList.remove('practice'); fade.classList.add('on'); setTimeout(go, delay); } else go();
    }
    const finish = () => leave(1500);
    setChar('gump', C('gump', 64, 54, { practice: true }));
    stage.addEventListener('click', tap);
    $('.s11-skip').addEventListener('click', e => { e.stopPropagation(); leave(0); });
    tap();
  }

    document.querySelectorAll('.s11-wrap').forEach(el => el.remove());
    boot(next);
  };
})();

      G.st = 'toM'; G.p = 0; G.from = G.x; G.dur = (perfect ? .85 : 1.45) * slowK(); ring.classList.remove('on');
    }
    function vanishMaya() { if (G.mayaGone) return; G.mayaGone = true; maya.classList.remove('gl1'); maya.classList.add('gl2'); T(1600, () => maya.classList.add('gone')); }
    function phases() {
      const e = G.el;
      if (!G.p2 && e >= T_P2) {
        G.p2 = true; while (G.shown < crs.length) showCredit();
        T(1200, () => { cr.classList.add('out'); T(1800, () => { thx.classList.add('on'); }); });
        maya.classList.add('gl1');
      }
      if (G.p2 && !G.p3 && e >= 35) { maya.classList.remove('gl1'); maya.classList.add('gl2'); }
      if (G.p2 && !G.p3 && e >= T_P3 - 6 && !thx.classList.contains('fade')) thx.classList.add('fade');
      if (!G.p3 && e >= T_P3) {
        G.p3 = true; G.final = true;
        if (G.st !== 'toM') vanishMaya();
      }
      if (G.final && !G.done && G.st !== 'toD' && e >= 52.5) { if (G.st === 'toM' || G.st === 'mHold') { G.mayaGone || vanishMaya(); } G.st = 'gWait'; G.x = FX0; G.wait = 0; G.p = 1; kick(true); }
      if (!G.p4 && e >= T_P4) summary();
      if (G.p2 && !G.p3 && e - G.noiseAt > 2.4) { G.noiseAt = e; noise(.04 + (e - T_P2) * .004, .22); }
    }
    function stepBall(dt) {
      if (G.st === 'toG') { G.p = Math.min(1, G.p + dt / G.dur); G.x = lerp(G.from, FX0, ease(G.p)); if (G.p >= 1) { G.st = 'gWait'; G.wait = 0; } }
      else if (G.st === 'gWait') { G.wait += dt; G.x = FX0; }
      else if (G.st === 'toM') {
        G.p = Math.min(1, G.p + dt / G.dur); G.x = lerp(G.from, FX1, G.p);
        ball.style.transform = 'translateY(' + (-Math.sin(Math.PI * G.p) * 4) + 'cqw) rotate(' + (G.x * 14) + 'deg)';
        if (G.p >= 1) {
          G.st = 'mHold'; G.hold = 0;
          if (!G.mayaGone) pop(maya, 'hit', 320);
        }
      }
      else if (G.st === 'mHold') {
        G.hold += dt; G.x = FX1;
        if (G.hold >= .45) {
          if (G.final && !G.mayaGone) vanishMaya();
          G.st = 'toG'; G.p = 0; G.from = FX1; G.dur = 2.4 * slowK();
        }
      }
      else if (G.st === 'toD') {
        G.p = Math.min(1, G.p + dt / 3.8); G.x = lerp(G.from, 135, ease(G.p));
        ball.style.opacity = String(Math.max(0, 1 - Math.max(0, G.p - .25) / .6));
        if (G.p >= 1 && !G.done) { G.done = true; }
      }
      if (G.st !== 'toM') ball.style.transform = 'rotate(' + (G.x * 14) + 'deg)';
      ball.style.left = G.x + 'cqw';
      ring.classList.toggle('on', inZone() && !G.final || (G.final && inZone() && G.mayaGone));
    }
    let last = 0;
    function tick(now) {
      if (dead) return; if (!last) last = now;
      const dt = Math.min(.05, (now - last) / 1000); last = now; G.el += dt;
      if (!G.p2 && crs.length && G.shown < Math.min(crs.length, Math.floor(G.el / 4.2))) showCredit();
      phases(); stepBall(dt);
      if (G.p4 && G.el >= T_P4 + SUM_HOLD && !G.cut) { G.cut = true; goLab(); return; }
      raf = requestAnimationFrame(tick);
    }
    function summary() {
      G.p4 = true; ring.classList.remove('on'); hint.classList.add('off');
      const parts = STATS.filter(k => G.gain[k] > 0).map(k => '<b>' + SN[k] + ' +' + G.gain[k] + '</b>');
      sum.innerHTML = '<h3>THE LAST PASS</h3><p>' + (G.kicks ? 'โบนัสถาวรที่ได้จากการส่งบอล ' + G.kicks + ' ครั้ง<br>' + parts.join(' · ') : 'ครั้งนี้ไม่ได้เตะเลย...<br>แต่บอลก็ยังจำจังหวะของ'+playerName()+'ได้') + '</p><small>(เก็บเข้า stats ถาวรแล้ว)</small>';
      sum.classList.add('on');
    }
    stage.addEventListener('pointerdown', e => { if (e.target.closest('.s11l-skip')) return; if (labEl.style.display === 'block') return labTap(); ac(); kick(false); });

    
    let li = -1, auto = true, labAt = 0;
    const box = $('.s11l-box'), holo = $('.s11l-holo'), eye = $('.s11l-eye'), foot = $('.s11l-foot'), txt = $('.s11l-txt'), roll = $('.s11l-roll');
    function goLab() {
      cancelAnimationFrame(raf); gameEl.style.display = 'none'; labEl.style.display = 'block';
      auto = false; T(500, () => { holo.classList.add('on'); li = -1; labNext(); });
    }
    function labNext() {
      if (dead) return; li++; const d = LAB[li]; if (!d) return;
      if (d.footage) return footage();
      if (d.eye) { labEl.classList.add('eye'); eye.classList.add('on'); } else if (li > 0) { eye.classList.remove('on'); labEl.classList.remove('eye'); }
      if (d.dir) { box.className = 's11l-box dir show'; box.innerHTML = '[ ' + PN(d.dir) + ' ]'; }
      else { box.className = 's11l-box show'; box.style.setProperty('--bc', '#9fb4ff'); box.innerHTML = '<span class="nm">ไค</span>' + d.text + (d.sub ? '<span class="sub">' + PN(d.sub) + '</span>' : ''); }
    }
    function labTap() { if (auto || Date.now() - labAt < 260) return; labAt = Date.now(); labNext(); }
    function typeLines(lines, red, ms) { txt.className = 's11l-txt' + (red ? ' red' : ''); txt.innerHTML = lines.join('<br>'); void txt.offsetWidth; txt.classList.add('on'); T(ms, () => txt.classList.remove('on')); }
    function footage() {
      auto = true; box.classList.remove('show'); eye.classList.remove('on'); labEl.classList.remove('eye'); holo.classList.remove('on');
      $('.s11l-kai').style.opacity = '0'; $('.s11l-bg').style.opacity = '0';
      const vid = foot.querySelector('video');
      const D = (vid && isFinite(vid.duration) && vid.duration > 0) ? Math.min(40000, Math.max(3000, vid.duration * 1000)) : 6500;
      T(500, () => {
        foot.classList.add('on'); noise(.05, .5);
        if (vid) { try { vid.currentTime = 0; } catch (e) {} const pr = vid.play(); if (pr && pr.catch) pr.catch(() => { vid.muted = true; try { vid.play(); } catch (e) {} }); }
      });
      T(500 + D - 900, () => { pop(foot, 'flash', 160); });
      T(500 + D - 500, () => { foot.classList.add('brk'); noise(.1, .6); });
      T(500 + D + 500, () => { foot.classList.remove('on'); if (vid) vid.pause(); });
      T(500 + D + 1700, () => typeLines(['ARCHIVE FOOTAGE: UNKNOWN', 'SUBJECT: GUMP', 'DATA: PARTIALLY CORRUPTED'], false, 3300));
      T(500 + D + 6100, creditsRoll);
    }
    function creditsRoll() {
      roll.innerHTML = '<h2>STRIKER FOOTBALL</h2>' + CREDITS.map(c => '<div>' + crHTML(c) + '</div>').join('') + '<div><b>' + SPECIAL[0] + '</b><small>' + SPECIAL[1] + '</small></div>';
      roll.style.display = 'flex'; let skip = false;
      const go = () => { if (skip) return; skip = true; roll.style.display = 'none'; finalText(); };
      T(17200, go); T(3000, () => { auto = false; labTap = () => { go(); }; });
    }
    function finalText() { typeLines(['KAI GROUP — PROJECT #01', 'STATUS: ONGOING'], false, 5200); T(5400, () => finish()); }

    function finish() { if (dead) return; dead = true; TM.forEach(clearTimeout); cancelAnimationFrame(raf); wrap.style.transition = 'opacity .6s'; wrap.style.opacity = '0'; setTimeout(() => { wrap.remove(); if (typeof next === 'function') next(); }, 650); }
    $('.s11l-skip').addEventListener('click', e => { e.stopPropagation(); finish(); });
    ball.style.left = G.x + 'cqw';
    raf = requestAnimationFrame(tick);
  }
  window.startEnding11 = function (next) {
    document.querySelectorAll('.s11l-wrap').forEach(el => el.remove());
    startEnding(next);
  };
})();
</script>
<script>

(function(){
  var mainTap=window.__pmTapMain,mainFail=window.__pmImgFailMain,legTap=window.pmTap,legFail=window.pmImgFail;
  var isMain=function(){return !!document.querySelector('.pm-ov .pm-canvas')};
  var pick=function(reg,main,leg){return function(){
    if(isMain()&&main)return main.apply(this,arguments);
    var r=window.__pmLegacy&&window.__pmLegacy[window.__pmScene];
    var f=(r&&r[reg])||leg;
    return f&&f.apply(this,arguments)}};
  if(mainTap&&legTap!==mainTap)window.pmTap=pick('tap',mainTap,legTap);
  if(mainFail&&legFail!==mainFail)window.pmImgFail=pick('fail',mainFail,legFail);
  var leaked=[];
  function sync(){
    document.querySelectorAll('style[id]').forEach(function(st){
      if(leaked.indexOf(st)<0&&/\.pm-(slot|port|stage|ov)\s*[{.,\[:]/.test(st.textContent))leaked.push(st)});
    var off=isMain();
    leaked.forEach(function(st){st.disabled=off});
  }
  sync();
  var app=document.getElementById('app');
  if(app)new MutationObserver(sync).observe(app,{childList:true});
  new MutationObserver(sync).observe(document.head,{childList:true});
})();
</script>
<script>

window.statMods=function(){
  console.group('📋 modifier ที่เก็บอยู่');
  console.log('R.mods (ด่านนี้):'+(R&&R.mods?R.mods.length:' ไม่มีด่าน'));
  if(R&&R.mods&&R.mods.length)console.table(R.mods.map(function(m){return{id:m.id,src:m.src,cat:m.cat,stat:m.stat,op:m.op,v:(typeof m.v==='function'?'(fn)':m.v),ttl:m.ttl?(m.ttl.ev+'×'+m.ttl.n):''}}));
  console.log('S.mods (ถาวร):'+(S&&Array.isArray(S.mods)?S.mods.length:0));
  if(S&&S.mods&&S.mods.length)console.table(S.mods);
  console.groupEnd();
};
window.statDebug=function(mode){
  if(typeof S==='undefined'||!S){console.warn('statDebug: ยังไม่มีเซฟ (S)');return null}
  const opts=(mode&&typeof mode==='object')?mode:undefined;
  const main=STAT_KEYS.concat(['maxHp']);
  const extra=(mode==='all')?['procLukMul','extremeHpPct','lockTEC','burnMul','passiveBurn']
    .concat(Object.keys(ACT_BURN).map(function(k){return 'burn.'+k}),ZONE_ORDER.slice(0,4).map(function(z){return 'zone.'+z})):[];
  const out={},live=eff(),liveHp=maxHp();
  console.group('⚙ STAT ENGINE — breakdown');
  console.log('น้ำหนัก:',S.body?S.body.w:'-','· โซน:',S.body?bodyClass(S.body.w):'-','· legend:',S.legendActive||'-','· ด่าน:',R?('index '+R.stage+' · HP '+R.hp):'(ไม่ได้อยู่ในด่าน)');
  main.concat(extra).forEach(function(ch){
    const c=statCalc(ch,opts);
    out[ch]=c.final;
    (main.indexOf(ch)>=0?console.group:console.groupCollapsed).call(console,ch+'  =  '+c.final);
    console.table(c.lines);
    console.groupEnd();
  });
  if(!opts){
    const bad=STAT_KEYS.filter(function(k){return live[k]!==out[k]}).concat(liveHp!==out.maxHp?['maxHp']:[]);
    console.log(bad.length?'❌ ไม่ตรงกับ eff()/maxHp(): '+bad.join(','):'✅ ตรงกับ eff()/maxHp() ทุกค่า');
  }
  console.groupEnd();
  return out;
};
let lastTouchTime = Date.now();
window.addEventListener('pointerdown', () => { lastTouchTime = Date.now(); });

setInterval(() => {
 if(Date.now() - lastTouchTime < 10000) return; // เปลี่ยนเป็น 10 วินาทีตามต้องการ
 if(!R || !R.endless) return; // ออโต้ตอนไม่แตะจอ ใช้ได้เฉพาะ Endless
 if(document.querySelector('.scoreboard.win, .scoreboard, .caf-menu')) return;
 
 if(!R._firstDraftDone) {
   if (R.scene === 'fight' && !document.querySelector('.draft-modal')) R._firstDraftDone = true; 
   else return; 
 }

 if(document.querySelector('.draft-modal')){
  if(typeof DRAFT !== 'undefined' && DRAFT.length) {
   if(!R.pickedIdx) R.pickedIdx = new Set();
   let p = [];
   for(let i=0; i<DRAFT.length; i++) if(!R.pickedIdx.has(i)) p.push(i);
   while(R.pickedIdx.size < 5 && p.length > 0) R.pickedIdx.add(p.shift()); 
   if(typeof refreshDraft==='function') refreshDraft();
   if(R.pickedIdx.size >= 5) setTimeout(()=>{if(typeof confirmPicks==='function') confirmPicks()}, 200);
   lastTouchTime = Date.now(); // บอทกดแล้ว รีเซ็ตเวลารอใหม่
   return;
  }
 }

 for(let m of document.querySelectorAll('.modal:not(.s2p-modal)')){
  const ops=m.querySelectorAll('.cardpick, button.btn-y:not([disabled]), button.act:not(.el-locked)');
  if(ops.length){
   ops[0].click();
   lastTouchTime = Date.now(); // บอทกดแล้ว รีเซ็ตเวลารอใหม่
   return;
  }
 }
 
 if(guard()&&R.scene==='fight'&&!R.bubTalk&&!R.cutin&&!document.querySelector('.oneone-wrap,.winimg-ov,.s11g')){
  let ks=availableActs().filter(k=>!isElLocked(k)&&!isVikLocked(k));
  if(ks.length){
   doAct(ks[0],false,false);
   lastTouchTime = Date.now(); // บอทออกท่าแล้ว รีเซ็ตเวลารอใหม่
  }
 }
}, 2000);
