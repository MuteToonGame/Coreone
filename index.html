<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Striker Football — Roguelite</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;900&family=Rajdhani:wght@600;700&family=Baloo+2:wght@700;800&display=swap');
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
}

img[src$="Maya2.webp"] {
  transform: scale(2) translate(0%, 30%) !important;
  transform-origin: bottom right;
}

svg, canvas {
  width: 100vw;
  height: 100vh;
  display: block;
}            
:root{--acc:#ffd54a;--acc2:#ff8a3d;--red:#ff3d5c;--blu:#4ea8ff;--cyan:#3df2ff;--grn:#3dffa0;--pink:#ff4ecd;--vio:#9b5cff;
 --metal:linear-gradient(155deg,#3a4048,#181c22 45%,#0a0c10);--glass:rgba(255,255,255,.055);
 --glow-acc:0 0 10px rgba(255,213,74,.6),0 0 30px rgba(255,213,74,.28);
 --glow-cy:0 0 10px rgba(61,242,255,.55),0 0 28px rgba(61,242,255,.25);
 --glow-pk:0 0 12px rgba(255,78,205,.55),0 0 30px rgba(155,92,255,.3);
 --ink:#160c1f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Rajdhani","Segoe UI",system-ui,"Noto Sans Thai",sans-serif;position:relative;background:
 radial-gradient(ellipse 90% 50% at 18% -8%,rgba(255,78,205,.16),transparent 55%),
 radial-gradient(ellipse 90% 55% at 88% 0%,rgba(61,242,255,.14),transparent 55%),
 radial-gradient(ellipse 140% 70% at 50% 120%,rgba(155,92,255,.16),transparent 60%),
 linear-gradient(165deg,#150a24,#0a0716 55%,#050308);
 color:#eaf6f0;min-height:100vh;display:flex;justify-content:center;padding:14px;overflow-x:hidden;overflow-y:auto}

#app{width:100%;max-width:840px;position:relative;z-index:1;display:block}
#app.show{display:block}
#err{position:fixed;top:0;left:0;right:0;background:#a01028;color:#fff;padding:8px 12px;font-size:12px;z-index:99;display:none}
.card{background:linear-gradient(155deg,rgba(255,255,255,.07),rgba(255,255,255,.02) 55%),var(--glass);
 border:1px solid rgba(255,255,255,.12);
 border-radius:16px 16px 16px 4px;padding:16px;margin-bottom:12px;position:relative;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 22px rgba(0,0,0,.4)}
.card::before{content:'';position:absolute;inset:0;border-radius:16px 16px 16px 4px;padding:1.5px;pointer-events:none;
 background:linear-gradient(140deg,rgba(255,255,255,.22),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 65%,rgba(255,78,205,.35));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.card::after{content:'';position:absolute;right:0;top:0;width:0;height:0;pointer-events:none;
 border-style:solid;border-width:0 16px 16px 0;border-color:transparent rgba(255,213,74,.5) transparent transparent}
h1{font-family:"Baloo 2","Kanit",sans-serif;font-size:29px;font-weight:800;color:var(--acc);letter-spacing:.5px;
 -webkit-text-stroke:1.6px var(--ink);paint-order:stroke fill;
 text-shadow:2px 3px 0 rgba(0,0,0,.5),var(--glow-acc)}
h2{font-family:"Baloo 2","Kanit",sans-serif;font-size:19px;font-weight:700;margin-bottom:10px;color:var(--acc);
 -webkit-text-stroke:.6px rgba(22,12,31,.7);paint-order:stroke fill;
 text-shadow:1px 2px 0 rgba(0,0,0,.4),0 0 8px rgba(255,213,74,.35)}
h3{font-size:15px;font-weight:700;margin:10px 0 6px;color:#9fe8c8}
button{font-family:"Rajdhani",inherit;cursor:pointer;border:none;border-radius:9px;padding:10px 14px;
 font-size:15px;font-weight:700;letter-spacing:.3px;background:linear-gradient(160deg,#1c8a6c,#0e5b45);
 color:#eafff6;transition:.15s;border:1.5px solid rgba(255,255,255,.22);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
 box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22)}
button:hover{filter:brightness(1.22) saturate(1.1);transform:translateY(-1px) scale(1.015)}
button:active{transform:translateY(1px) scale(.99)}
button:disabled{opacity:.35;cursor:not-allowed;filter:none;transform:none}
.btn-y{background:linear-gradient(160deg,#ffe58a,var(--acc) 55%,#e0a600);color:#231900;
 box-shadow:0 3px 0 rgba(0,0,0,.4),var(--glow-acc)}
.btn-r{background:linear-gradient(160deg,#ff5d7a,#c8324f 60%,#7a1830)}
.btn-g{background:linear-gradient(160deg,#6ab8ff,#4d8dff 55%,#1a4fc2)}
.row{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:8px}
.caf-menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.caf-item{padding:8px 10px}
.caf-item h3{font-size:13px;margin:0 0 4px;line-height:1.25}
.caf-item .small{font-size:11px;line-height:1.3;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.caf-item .btn-y{width:100%;padding:6px 8px;font-size:12px}
.stat{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.32);
 padding:8px 12px;border-radius:9px 9px 9px 2px;margin-bottom:6px;border:1px solid rgba(255,255,255,.08)}
.bar{height:20px;background:#0e0a16;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.22);
 box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ff3d5c,#ff8a3d,#ffe58a);
 transition:.35s;box-shadow:0 0 12px rgba(255,150,60,.7)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;
 background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);margin:2px;font-variant-numeric:tabular-nums}
.hero-avatar{width:56px;height:56px;border-radius:50%;overflow:hidden;border:2px solid var(--acc);
 background:linear-gradient(160deg,#241338,#0a0614);position:relative;flex-shrink:0;
 box-shadow:0 0 10px rgba(255,213,74,.35),inset 0 1px 0 rgba(255,255,255,.1)}
.hero-avatar svg{position:absolute;left:50%;top:50%;width:90px;height:112px;
 transform:translate(-50%,-42%);animation:none!important}
.hero-avatar svg .aur{display:none}
.act{flex:1;min-width:158px;text-align:left;line-height:1.45}
.acts-compact .act{padding:7px 10px;font-size:13px;line-height:1.25}
.acts-compact .act .small{font-size:10px}
.acts-compact .row{gap:6px}
.small{font-size:12px;opacity:.78}
#log{height:112px;overflow-y:auto;font-size:13px;line-height:1.6;background:rgba(0,0,0,.35);
 padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.06)}
#log div{border-bottom:1px dashed rgba(255,255,255,.08);padding:2px 0}
.ok{color:#67f5a8}.bad{color:#ff8a95}.gold{color:var(--acc);text-shadow:0 0 6px rgba(255,213,74,.4)}.info{color:#8fd0ff}
.modal{position:fixed;inset:0;background:rgba(5,3,10,.94);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.mbox{background:linear-gradient(165deg,#241338,#140a22 60%,#0a0614);border:1.5px solid rgba(255,255,255,.22);
 border-radius:18px 18px 18px 4px;padding:18px;max-width:840px;width:100%;max-height:92vh;overflow-y:auto;
 box-shadow:0 0 0 1px rgba(255,255,255,.06),0 24px 70px rgba(0,0,0,.65),var(--glow-pk)}
.cardpick{border-radius:12px 12px 12px 3px;padding:12px;cursor:pointer;border:2px solid rgba(255,255,255,.08);
 background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));transition:.15s;position:relative;overflow:hidden}
.cardpick::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.12) 50%,transparent 60%);
 transform:translateX(-120%);transition:transform .5s}
.cardpick:hover::after{transform:translateX(120%)}
.cardpick:hover{transform:translateY(-4px) scale(1.02);border-color:var(--acc);box-shadow:var(--glow-acc)}
.c-stat{border-left:5px solid var(--acc)}.c-help{border-left:5px solid var(--blu)}
.c-atk{border-left:5px solid #ff7a3d}.c-risk{border-left:5px solid var(--red)}
.stagebtn{text-align:left;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));
 border:1.5px solid rgba(255,255,255,.18);border-radius:9px 9px 9px 2px}
.lock{opacity:.35}
 .next{border:2px solid var(--acc)}
@keyframes pul-lite{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.natbtn{display:flex;align-items:center;gap:6px;padding:8px 12px}
.swatch{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid rgba(255,255,255,.4)}
.statnum{font-family:"Kanit",sans-serif;font-weight:900;font-variant-numeric:tabular-nums}
.hpnum{font-family:"Kanit",sans-serif;font-weight:900;font-size:15px;text-shadow:0 0 8px rgba(255,90,90,.5)}
.chancebig{font-family:"Kanit",sans-serif;font-weight:900;font-size:17px;text-shadow:var(--glow-acc)}
.speechbox{background:linear-gradient(165deg,#2a1a3a,#150c22);border:1.5px solid rgba(255,180,80,.4);
 border-radius:16px 16px 16px 4px;padding:16px 18px;position:relative;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.55)}
.speechbox::before{content:'';position:absolute;left:26px;top:-9px;width:16px;height:16px;
 background:linear-gradient(165deg,#2a1a3a,#150c22);border-left:1px solid rgba(255,180,80,.4);
 border-top:1px solid rgba(255,180,80,.35);transform:rotate(45deg)}
.spkname{font-family:"Kanit",sans-serif;font-weight:900;color:var(--acc2);font-size:14px;letter-spacing:.4px}
.dlg-row{display:flex;align-items:flex-start;gap:9px;margin-top:12px}
.dlg-row:first-child{margin-top:0}
.dlg-row.dlg-r{flex-direction:row-reverse}
.dlg-av{flex:0 0 40px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 font-size:19px;background:#1a1226;border:2px solid rgba(255,180,80,.45);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.dlg-av-player{border-color:rgba(61,242,255,.5)}
.dlg-bubble{margin-top:0!important;flex:1}
.dlg-bubble::before{top:16px!important;left:-8px!important;width:14px!important;height:14px!important}
.dlg-row.dlg-r .dlg-bubble::before{left:auto!important;right:-8px!important}

/* ===================== PITCH ===================== */
.pitch{position:relative;height:250px;border-radius:16px 16px 16px 4px;overflow:hidden;cursor:pointer;user-select:none;contain:layout paint;
 background:
  radial-gradient(ellipse 75% 45% at 50% 4%,rgba(255,225,150,.28),rgba(255,180,120,0) 65%),
  radial-gradient(ellipse 60% 30% at 12% 0%,rgba(255,78,205,.22),transparent 70%),
  radial-gradient(ellipse 60% 30% at 88% 0%,rgba(61,242,255,.2),transparent 70%),
  linear-gradient(180deg,#0a0f2c 0%,#0d2c4a 12%,#0f3a3a 22%,#116b3e 30%,#1f9450 38%,#1c8248 55%,#186f3e 75%,#125c33 100%);
 border:1.5px solid rgba(255,255,255,.16);margin-bottom:12px;box-shadow:inset 0 0 60px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4)}
.crowd{position:absolute;top:0;left:0;width:300%;height:22%;
 background:
  repeating-linear-gradient(90deg,rgba(255,213,74,.13) 0 3px,transparent 3px 21px),
  repeating-linear-gradient(90deg,#264874 0 5px,#345a8c 5px 10px,#1c3258 10px 15px,#3f6aa0 15px 20px,#274a78 20px 25px,#4577b3 25px 30px);
 box-shadow:inset 0 -10px 14px -4px rgba(0,0,0,.55)}
.crowd::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 40px,transparent 40px 46px)}
.stand{position:absolute;top:19%;left:0;width:300%;height:4.5%;
 background:linear-gradient(180deg,#05070a,#0d1118);box-shadow:0 3px 8px rgba(0,0,0,.6)}
.mow{position:absolute;top:30%;left:0;width:300%;height:70%;
 background:repeating-linear-gradient(90deg,rgba(10,50,20,.3) 0 54px,rgba(20,80,40,.16) 54px 108px)}
.mowlines{position:absolute;top:30%;left:0;width:100%;height:70%;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 54px,transparent 54px 108px)}
.blades{position:absolute;top:30%;left:0;width:300%;height:70%;opacity:.5;
 background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 7px)}
.stripes{position:absolute;top:30%;left:0;width:300%;height:70%;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.075) 0 54px,transparent 54px 108px)}
.vignette{position:absolute;inset:0;z-index:6;pointer-events:none;
 background:radial-gradient(ellipse 90% 75% at 50% 55%,transparent 55%,rgba(0,0,0,.4) 100%)}
.hline{position:absolute;left:0;width:300%;height:3px;background:rgba(255,255,255,.22)}
@keyframes scr{to{transform:translateX(-108px)}}
.blades{display:none}
.pitch.spd-fast .mow{animation:scr 1.2s linear infinite}
.pitch.spd-mid .mow{animation:scr 1.6s linear infinite}
.pitch.spd-slow .mow{animation:scr 4s linear infinite}
.hero,.foe{position:absolute;bottom:10px;z-index:4}
.hero{left:10%}.foe{right:12%}
.foe-actions{position:absolute;left:82%;top:-85px;transform:translateX(-50%);display:flex;gap:7px;z-index:12;white-space:nowrap}
.foe-action{clip-path:none;width:38px;height:38px;padding:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:rgba(10,6,20,.9);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.45),0 0 10px rgba(255,78,205,.15);transition:transform .12s ease,background .12s ease,border-color .12s ease}
.foe-action:active{transform:scale(.88)}
.foe-action:hover{background:rgba(45,22,55,.96);border-color:rgba(255,215,90,.95)}
.foe-action small{display:block;font-size:8px;line-height:1;margin-top:2px;opacity:.82}
.hero .lean{transform:rotate(-5deg)}
.foe .mir{transform:scaleX(-1)}
.goalpost{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:230px;height:170px;z-index:-1;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.foe .goalpost{transform:translateX(-50%) scaleX(-1)}
.chr{height:150px;width:auto;display:block;overflow:visible;will-change:transform}
.chr2d{height:150px;width:auto;display:block;object-fit:contain;image-rendering:auto}
.chr2d.kick{animation:heroKick2d .65s ease-in-out both}
@keyframes heroBob2d{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-3px) rotate(-1deg)}}
@keyframes heroIdle2d{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-2px) rotate(1deg)}}
@keyframes heroKick2d{0%{transform:rotate(0)}45%{transform:rotate(-3deg) translateY(-2px)}100%{transform:rotate(0)}}
.ghost{z-index:3;opacity:.30;filter:none}
.ball{position:absolute;left:calc(10% + var(--bx,100px));bottom:8px;width:25px;height:25px;z-index:5;will-change:transform}
.ball svg{width:100%;height:100%}
.shadow{position:absolute;bottom:6px;width:74px;height:12px;border-radius:50%;background:rgba(0,0,0,.32);z-index:2}
.shadow.h{left:calc(10% + 12px)}.shadow.f{right:calc(12% + 12px)}

.chr .j{transform-box:view-box}
@keyframes hipK{0%{transform:rotate(-42deg)}25%{transform:rotate(-6deg)}50%{transform:rotate(32deg)}75%{transform:rotate(4deg)}100%{transform:rotate(-42deg)}}
@keyframes kneeK{0%{transform:rotate(50deg)}25%{transform:rotate(10deg)}50%{transform:rotate(4deg)}75%{transform:rotate(74deg)}100%{transform:rotate(50deg)}}
@keyframes shdK{0%{transform:rotate(36deg)}50%{transform:rotate(-38deg)}100%{transform:rotate(36deg)}}
@keyframes elbK{0%{transform:rotate(-48deg)}50%{transform:rotate(-14deg)}100%{transform:rotate(-48deg)}}
@keyframes bobK{0%,100%{transform:translateY(0)}25%{transform:translateY(-7px)}50%{transform:translateY(0)}75%{transform:translateY(-5px)}}

@keyframes swayK{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
.chr.guard{animation:swayK 1.3s ease-in-out infinite}
.chr.guard .hipF{transform:rotate(-16deg)}.chr.guard .hipB{transform:rotate(17deg)}
.chr.guard .kneeF{transform:rotate(16deg)}.chr.guard .kneeB{transform:rotate(12deg)}
.chr.guard .shdF{transform:rotate(-52deg)}.chr.guard .shdB{transform:rotate(50deg)}
.chr.guard .elbF{transform:rotate(-28deg)}.chr.guard .elbB{transform:rotate(26deg)}
.aur{opacity:.5}
@keyframes aurK{from{opacity:.9}to{opacity:.2}}
@keyframes roll{to{transform:rotate(360deg)}}
.pitch.s-travel .ball,.pitch.s-run .ball,.pitch.s-fight .ball{animation:roll .5s linear infinite}

@keyframes drbHero{0%{left:10%;bottom:10px}28%{left:32%;bottom:40px}52%{left:50%;bottom:52px}78%{left:68%;bottom:16px}100%{left:76%;bottom:10px}}
@keyframes drbBall{0%{left:22%;bottom:8px}20%{left:40%;bottom:30px}42%{left:58%;bottom:26px}100%{left:95%;bottom:8px}}
@keyframes drbFoe{0%{transform:rotate(0)}30%{transform:rotate(-16deg) translateX(-12px)}52%{transform:rotate(20deg) translateX(16px)}76%{transform:rotate(-10deg)}100%{transform:rotate(5deg)}}
.pitch.s-wDRB .hero{animation:drbHero 1.25s cubic-bezier(.3,.7,.4,1) forwards}
.pitch.s-wDRB .ball{animation:roll .3s linear infinite,drbBall 1.25s ease-in-out forwards}
.pitch.s-wDRB .foe{animation:drbFoe 1.25s ease-in-out forwards}
.pitch.s-wDRB .g1,
.pitch.s-wDRB .g2,
.pitch.s-wDRB .g3,
.pitch.s-wDRB .runner,
.pitch.s-wDRB .hero-run {
  display: none !important;
}

@keyframes pwdHero{0%{left:10%}30%{left:40%}44%{left:52%}52%{left:49%}100%{left:66%}}
@keyframes pwdBall{0%{left:22%;bottom:8px}44%{left:56%;bottom:18px}100%{left:80%;bottom:8px}}
@keyframes pwdFoe{0%,42%{right:12%;bottom:10px;transform:rotate(0)}55%{right:0%;bottom:80px;transform:rotate(140deg)}100%{right:-28%;bottom:170px;transform:rotate(340deg);opacity:.45}}
@keyframes boomK{0%{transform:scale(.2);opacity:0}45%{transform:scale(.3);opacity:0}55%{transform:scale(1.5);opacity:1}100%{transform:scale(2.6);opacity:0}}
.pitch.s-wPWD .hero{animation:pwdHero 1.3s cubic-bezier(.35,.9,.3,1) forwards}
.pitch.s-wPWD .ball{animation:roll .2s linear infinite,pwdBall 1.3s ease-out forwards}
.pitch.s-wPWD .foe{animation:pwdFoe 1.3s cubic-bezier(.2,.6,.4,1) forwards}
.pitch.s-wPWD{animation:shk .5s .5s}
.boom{position:absolute;right:16%;bottom:46px;z-index:6;font-size:56px;animation:boomK 1.3s ease-out forwards;pointer-events:none}
.ring{position:absolute;right:14%;bottom:56px;width:60px;height:60px;border:5px solid rgba(255,225,120,.9);border-radius:50%;z-index:6;animation:boomK 1.3s ease-out forwards}

/* ================= ZERO CANNON: ปักหลักยิงทันที ================= */
@keyframes zeroHero{
  0%, 42% { left: 10%; bottom: 10px; } /* ปักหลักอยู่กับที่ สับไกยิงทันที */
  55%     { left: 28%; bottom: 10px; } /* เริ่มสปรินต์ตามบอล */
  100%    { left: 78%; bottom: 10px; } /* วิ่งทะลุผ่านไปเก็บบอล */
}
@keyframes zeroPose{
  0%      { transform: rotate(-5deg); }
  15%     { transform: rotate(-22deg) translateY(-3px) scale(1.05); } /* ง้างเท้าสุดแรง */
  28%     { transform: rotate(18deg) translateY(-2px) scale(1.08); }  /* สับไกฟาดบอลตูม */
  55%     { transform: rotate(-10deg); }                              /* โน้มตัวสปรินต์ */
  100%    { transform: rotate(-5deg); }
}
@keyframes zeroBall{
  0%, 25% { left: 22%; bottom: 8px; }
  35%     { left: 66%; bottom: 16px; } /* บอลพุ่งเป็นลำแสงพุ่งอัดใส่กองหลัง */
  50%     { left: 74%; bottom: 10px; } /* กระแทกทะลวงผ่าน */
  100%    { left: 86%; bottom: 8px; }  /* บอลไปรอข้างหน้า */
}
@keyframes zeroFoe{
  0%, 30% { transform: rotate(0) translateX(0); }
  36%     { transform: rotate(15deg) translateX(15px); }                     /* โดนลูกยิงอัดกระแทก */
  55%     { transform: rotate(45deg) translateX(65px) translateY(-35px); }   /* ตัวงอ ลอยกระเด็น */
  85%     { transform: rotate(65deg) translateX(110px) translateY(-20px); }
  100%    { transform: rotate(45deg) translateX(130px) translateY(-5px); opacity:.45; }
}

.pitch.s-wPSS .hero{animation:zeroHero 1.35s cubic-bezier(.3,.8,.35,1) forwards}

.pm-ov{position:fixed;inset:0;z-index:9999;background:transparent;display:flex;flex-direction:column;

@keyframes sdShade{0%{opacity:1}16%{opacity:.4}72%{opacity:.4}88%{opacity:1}100%{opacity:1}}

function checkDrop(){
 if(!R)return;
 const luk=eff().luk;
 const roll=Math.random()*100;
 let acc=0;

 // 1. Gear rare — เข้า queue
 acc += 1.5 + luk*0.02;
 if(roll < acc){
  const pool=ITEMS.filter(i=>i.rarity==='rare' && !itemOwned(i.id));
  if(pool.length){
   const it=pool[Math.floor(rnd(pool.length))];
   R.giftQueue=R.giftQueue||[];
   R.giftQueue.push(it);
   log('⚔️ พบ '+it.icon+' '+it.n+' — จะได้รับตอนจบด่าน','info');
   return;
  }
 }

 // 2. Gear epic — เข้า queue
 acc += 0.8 + luk*0.01;
 if(roll < acc){
  const pool=ITEMS.filter(i=>i.rarity==='epic' && !itemOwned(i.id));
  if(pool.length){
   const it=pool[Math.floor(rnd(pool.length))];
   R.giftQueue=R.giftQueue||[];
   R.giftQueue.push(it);
   log('💎 พบ '+it.icon+' '+it.n+' — จะได้รับตอนจบด่าน','gold');
   return;
  }
 }

 // 3. Legend (ไอเทมลับ) — ☢️ (คำเตือน: โปรโตไทป์ไม่เสถียร อันตรายถึงชีวิต)
 if(legendUnlocked()){
  acc += 0.4;
  if(roll < acc){
   const pool=LEGEND_ITEMS.filter(i=>!itemOwned(i.id));
   if(pool.length){
    const it=pool[Math.floor(rnd(pool.length))];
    R.giftQueue=R.giftQueue||[];
    R.giftQueue.push(it);
    log('🌟 พบไอเทมลับ '+it.icon+' '+it.n+' — จะได้รับตอนจบด่าน!','gold');
    return;
   }
  }
 }

 // 4. Buff — ใช้ทันที
 acc += 25 + luk*0.20;
 if(roll < acc){
  const b=BUFFS[Math.floor(rnd(BUFFS.length))];
  applyBuff(b);
 }
}

/* ---------- 2) Helper: คลาส/ป้าย/มอดิฟายเออร์ร่างกาย ---------- */
function bodyClass(w){
  w = (w == null) ? 70 : w;
  return w < 70 ? 'thin' : (w > 100 ? 'fat' : 'fit');
}

function bodyLabel(w){
  if(w < 40)  return '💀 ผอมหนังติดกระดูก (HP เหลือ 1 / กินอาหารไม่ได้ Stat)';
  if(w < 70)  return '🏃 ผอม';
  if(w > 130) return '🐘 อ้วนยักษ์ (Agi = 1)';
  if(w > 100) return '🐘 อ้วน';
  return '⚖ พอดี';
}

function bodyMod(w){
  if(w < 40) return {str:-6, agi:10, dex:2, vit:-20, luk:0};
  const c = bodyClass(w);
  if(c === 'thin') return {str:-3, agi:5, dex:2, vit:-4, luk:0};
  if(c === 'fat'){
    if(w > 130) return {str:15, agi:-999, dex:-4, vit:20, luk:0};
    return {str:6, agi:-6, dex:-2, vit:8, luk:0};
  }
  return {str:0, agi:0, dex:0, vit:0, luk:0};
}

/* ---------- 4) ฟังก์ชันกินอาหาร (เวอร์ชันเดียว) ---------- */
function eatFood(k){
  const f = FOOD_MENU.find(x => x.k === k);
  if(!f) return;

  if((S.mp || 0) < f.cost){
    log('เงินไม่พอซื้อ ' + f.n, 'bad');
    scrCafeteria();
    return;
  }

  S.mp -= f.cost;

  if(!S.diet) S.diet = {str:0, agi:0, dex:0, vit:0};
  if(!S.body) S.body = {w:70};

  const isUnder40 = S.body.w < 40;

  if(f.gamble){
    if(Math.random() < .3){
      S.body.w = Math.max(0, S.body.w - 22);
      S.somtamBuff = {agi:8, vit:-5, stage:(S.unlocked || 1)};
      log('🌶 ส้มตำแจ็คพอตแตก! ท้องเสียขี้แตก วิ่งหนีเข้าห้องน้ำ วิ่งไวขึ้นชั่วคราว แต่ตัวผอมลงฮวบ!', 'gold');
    } else {
      S.body.w = Math.max(0, S.body.w - 4);
      log('🌶 กินส้มตำเฉยๆ เผ็ดจี๊ดหน่อยแต่ไม่มีอะไรเกิดขึ้น', 'info');
    }
    
  } else {
  // น้ำหนักเปลี่ยนเสมอ — ขึ้นง่าย ลดยาก
  let dw = f.dw || 0;
  if (dw > 0)      dw = Math.round(dw * 2);   // +5 → +7
  else if (dw < 0) dw = Math.round(dw * 0.6);   // -5 → -3
  S.body.w = Math.max(0, S.body.w + dw);
  const wChange = dw >= 0 ? `+${dw}` : `${dw}`;

  if(isUnder40){
    log(`🍽 กิน ${f.icon} ${f.n} (น้ำหนัก ${wChange}) ⚠️ ผอมเกินไป (<40) ร่างกายไม่ดูดซึม Stat!`, 'bad');
  } else {
    for(const st in f.st){
      S.diet[st] = (S.diet[st] || 0) + f.st[st];
    }
    log(`🍽 กิน ${f.icon} ${f.n} (น้ำหนัก ${wChange} · ${f.d})`, 'ok');
  }
}

  // ลบเมนูที่กินแล้วออกจากออฟเฟอร์
  CAF_OFFERS = CAF_OFFERS.filter(x => x.k !== k);

  if(typeof save === 'function') save();

  scrCafeteria();
}

/* ---------- 5) ระบบโรงอาหาร ---------- */
function maybeShowCafeteria(nextFn){
  if(S.cafPending){
    S.cafPending = false;
    save();
    CAF_NEXT = nextFn;
    CAF_OFFERS = pickFrom(FOOD_MENU, 4);
    scrCafeteriaRender();
  } else {
    nextFn();
  }
}

function scrCafeteria(){
  scrCafeteriaRender();
}

function leaveCafeteria(){
  const n = CAF_NEXT;
  CAF_NEXT = null;
  if(n) n(); else scrMapRender();
}

function scrCafeteriaRender(){
  if(!S.body) S.body = {w:70};
  if(!S.diet) S.diet = {str:0, agi:0, dex:0, vit:0};

  const menuHTML = CAF_OFFERS.length > 0
    ? CAF_OFFERS.map(f =>
        `<div class="cardpick c-stat caf-item">
          <h3>${f.icon} ${f.n}</h3>
          <p class="small">${f.d.replace(/ · น้ำหนัก.*$/, '')}</p>
          <button class="btn-y" ${((S.mp||0) < f.cost) ? 'disabled' : ''} onclick="eatFood('${f.k}')">🍴 ${baht(f.cost)}</button>
        </div>`
      ).join('')
    : `<div class="small" style="text-align:center;grid-column:1/-1;padding:20px 0;opacity:0.7">🍽 ของหมดแล้ว! ไปเตะบอลหาเมนูใหม่นะ</div>`;

  const barPct = Math.min(100, Math.round((S.body.w / 150) * 100));

  render(
    `<div class="card" style="padding:14px 16px 12px">
      <h2 style="margin-bottom:8px">🍜 โรงอาหารหลังเกม</h2>
      <div class="row" style="align-items:center;margin-bottom:6px">
        <b class="gold" style="font-size:20px">${baht(S.mp||0)}</b>
        <span class="pill">${bodyLabel(S.body.w)} (${Math.round(S.body.w)}kg)</span>
        <span class="pill">🍽 Str+${S.diet.str||0} Agi+${S.diet.agi||0} Dex+${S.diet.dex||0} Vit+${S.diet.vit||0}</span>
      </div>
      <div class="bar" style="height:10px;margin-bottom:12px">
        <i style="width:${barPct}%;background:linear-gradient(90deg,#ff6767,#67f5a8,#ffb85c,#ff3d5c)"></i>
      </div>
      <div class="caf-menu">
        ${menuHTML}
      </div>
      <button class="btn-big" onclick="leaveCafeteria()" style="margin-top:12px;padding:10px 16px;font-size:15px">🚪 ออกจากโรงอาหาร</button>
    </div>`
  );
}

/* ====== ACTION UNLOCK PROGRESSION ======
   - ด่าน 1: มีแค่ เลี้ยงหลบ (DRB)
   - ด่าน 2: ปลดล็อก เลี้ยงอัด (PWD)
   - ด่าน 3: กองหลังคนแรกบังคับแพ้ 1 รอบ → คัตอินปลดล็อก ZERO CANNON (TEC · กดค้างชาร์จ) — เนื้อเรื่องรอบแรกของเซฟ
   - ด่าน 4+: ใช้ได้ครบทุกท่า
*/
const isPwdLesson=()=>!!(R&&R.stage===1&&R.idx===0&&R.phase==='def'&&S&&S.story&&!S.story.pwdTaught);
const isPwdStep=()=>isPwdLesson()&&R.tutStep===1;   // หลังคัตอินโค้ช: ปุ่มเหลือ PWD อย่างเดียว
// ด่าน 3 (เกาหลีใต้) รอบแรก — R.zTut: 0 = ยังไม่ปลดล็อก ZERO CANNON · 1 = ปลดล็อกแล้ว เหลือปุ่มเดียว ชาร์จ MAX = ผ่านแน่นอน · 2 = เรียนจบ
const isZeroLocked=()=>!!(R&&R.zTut===0&&R.phase==='def');      // ปุ่ม DRB/PWD ยังกดได้ แต่กดอะไรก็โดนประกบจนแพ้ (บังคับ 1 รอบ)
const isZeroStep=()=>!!(R&&R.zTut===1);                         // หลังคัตอิน: ปุ่มเหลือ ZERO CANNON อย่างเดียว
const isZeroFinale=()=>!!(R&&R.zFin&&R.phase==='gk');           // ดวลโกลรอบแรก: ชาร์จ MAX = ระเบิดตุงตาข่าย (Whiteout)
const isDriftStep=()=>!!(R&&R.dTut===1);                        // ด่าน 4: R.dTut 1 = ปลดล็อก Shadow Drift แล้ว ต้องกดค้าง-ปล่อยในโซนทองถึงจะผ่าน · 2 = เรียนจบ
const zeroLessonOn=()=>isZeroLocked()||isZeroStep()||isZeroFinale()||isDriftStep();   // ไมก้า (ด่าน 5) ไม่ล็อกโหมด — เลือกท่าเองได้อิสระ ไม่ต้องเข้ากติกาบทเรียนนี้
// ข้อมูลคู่แข่งใต้แถบมายา (บอสประจำชาติ ฯลฯ) — ซ่อนไว้ก่อน · ค่อยลดเลขนี้ให้เริ่มแสดงตั้งแต่ด่านหลังๆ (นับจาก 0)
const FOE_INFO_FROM_STAGE=99;
const foeInfoOn=()=>!!R&&R.stage>=FOE_INFO_FROM_STAGE;
function availableActs(){
 const a=['DRB'];
 if(!R)return a;
 if(isPwdLesson())return R.tutStep===1?['PWD']:['DRB'];   // บทเรียน: ฮายาโตะ — เริ่มด้วยปุ่มเลี้ยงหลบอย่างเดียว (บังคับแพ้) แล้วหลังคัตอินโค้ชเหลือเลี้ยงอัดอย่างเดียว
 if(R.zTut===0)return['DRB','PWD'];                        // ด่าน 3 รอบแรก: ก่อนปลดล็อก ZERO CANNON
 if(R.dTut===1)return['DRB'];                                 // ด่าน 4: บทเรียน Shadow Drift (ปุ่มเดียว)
 if(R.zTut===1)return['TEC'];               // บทเรียนด่าน 3 (ครั้งแรกที่ปลดล็อก): ZERO CANNON อย่างเดียว · ตัวดวลจริง (isZeroFinale) และไมก้าด่าน 5 ไม่ล็อกแล้ว เลือกท่าเองได้เลย
 if(R.stage>=1) a.push('PWD');
 if(R.stage>=3 || (R.stage===2 && S.story && S.story.zeroUnlocked)) a.push('TEC');   // ด่าน 3 ปลดล็อกจากเนื้อเรื่อง (คัตอินกองหลังคนแรก)
 return a;
}

  const gain = Math.max(1, Math.round(cur * pct / 100));
  r.mod[key] = (r.mod[key] || 0) + gain;
  return gain;
}

 if(!e.gk){if(a.adv===e.type)c+=CFG.TYPE;else if(a.weak===e.type)c-=CFG.TYPE}

 }

 if(R.lastHope&&R.hp<maxHp()*.3)c+=20;

if(k==='DRB' && R.aceDRB) c=99;   // 🃏 ไพ่ตายในมือ — override ทุกอย่าง
return{chance:Math.round(c*10)/10,enemy:e,act:a}}

 if(!R||R.over){BUB_Q=[];return}

 if(!it){R.bubble=null;const dn=BUB_DONE;BUB_DONE=null;
  if(dn){R.bubTalk=false;dn();return}                                                   // มี callback ต่อ (เช่น คัตอินโค้ช) → ให้ callback คุมการปลดล็อกเอง

/* ================= 🌫️ SHADOW DRIFT: กดค้าง-ปล่อยให้ตรงโซนทองบนเกจคลื่นประสาท =================
   กดปุ่มเลี้ยงหลบค้าง → เกจคลื่นประสาทโผล่ · เคอร์เซอร์วิ่ง 0→1 ใน SD_MS · ปล่อยตอนอยู่ในโซนทอง = Perfect (+SD_BONUS%)
   แตะทีเดียว / ปล่อยนอกโซน / ค้างจนสุดเกจ = เลี้ยงหลบปกติ ไม่มีโทษ (ยกเว้นบทเรียนด่าน 4 ต้อง Perfect ก่อนถึงจะผ่าน) */
let SD=null;
const SD_WAVE='M0 20 L14 20 L20 12 L26 28 L32 20 L52 20 L58 8 L66 34 L72 20 L100 20 L106 14 L112 26 L118 20 L140 20 L146 6 L154 36 L160 20 L200 20';
function sdDown(e){
 if(e&&e.cancelable)e.preventDefault();
 if(SD||ZC||!guard()||!availableActs().includes('DRB')||!driftOn())return;
 const tut=isDriftStep(),w=tut?.2:SD_ZONE_W,z0=tut?.62:(.42+Math.random()*(.92-w-.42));
 SD={t0:performance.now(),z0,z1:z0+w,raf:0,pid:e?e.pointerId:0,buzz:false};
 window.addEventListener('pointerup',sdUp);
 window.addEventListener('pointercancel',sdAbort);
 const tt=document.getElementById('itemToast');if(tt)tt.remove();   // ไม่ให้ toast บังเกจ
 document.querySelectorAll('.sd-btn').forEach(b=>b.classList.add('hold'));
 sdTick()}
function sdBuild(){
 const pt=document.querySelector('.pitch');if(!pt||!SD)return;
 pt.querySelectorAll('.sdGauge').forEach(x=>x.remove());
 pt.insertAdjacentHTML('beforeend',`<div class="sdGauge"><svg viewBox="0 0 200 40" preserveAspectRatio="none"><path class="sdWave" d="${SD_WAVE}"/></svg><i class="sdZone" style="left:${(SD.z0*100).toFixed(1)}%;width:${((SD.z1-SD.z0)*100).toFixed(1)}%"></i><i class="sdCur"></i><span class="sdTx">NEURAL WAVE · ปล่อยตอนเข้าโซนทอง!</span></div>`)}
function sdTick(){
 if(!SD)return;
 if(!R||R.over||R.busy){sdAbort();return}
 const p=Math.min(1,(performance.now()-SD.t0)/SD_MS);
 let g=document.querySelector('.pitch .sdGauge');
 if(!g){sdBuild();g=document.querySelector('.pitch .sdGauge')}
 if(g){
  const inZ=p>=SD.z0&&p<=SD.z1;
  g.style.setProperty('--sd',(p*100).toFixed(1)+'%');
  g.classList.toggle('in',inZ);g.classList.toggle('end',p>=1);
  if(inZ&&!SD.buzz){SD.buzz=true;if(navigator.vibrate)navigator.vibrate(18)}}
 SD.raf=requestAnimationFrame(sdTick)}
function sdClear(){
 document.querySelectorAll('.sd-btn').forEach(b=>b.classList.remove('hold'));
 document.querySelectorAll('.sdGauge').forEach(g=>g.remove())}
function sdStop(){
 if(!SD)return null;
 cancelAnimationFrame(SD.raf);
 window.removeEventListener('pointerup',sdUp);window.removeEventListener('pointercancel',sdAbort);
 const z=SD;SD=null;sdClear();return z}
function sdUp(e){
 if(!SD||(e&&e.pointerId!==SD.pid))return;
 const z=sdStop();if(!z||!guard())return;
 const p=Math.min(1,(performance.now()-z.t0)/SD_MS),perfect=p>=z.z0&&p<=z.z1;
 if(perfect&&!isDriftStep())showToast('🌫️ SHADOW DRIFT! +'+SD_BONUS+'%','buff');

 const r=Math.random()*100;
 if(r<60)return{t:'cow'};
 if(r<90)return{t:'none'};
 if(r<99){
  const pool=ITEMS.filter(i=>!itemOwned(i.id));
  return pool.length?{t:'item',it:pool[Math.floor(rnd(pool.length))]}:{t:'dup'}}
 const lp=LEGEND_ITEMS.filter(i=>!itemOwned(i.id));
 return lp.length?{t:'legend',it:lp[Math.floor(rnd(lp.length))]}:{t:'dup'}}

// mode:'intro' = รอบแรกบังคับฟรี+ได้ควาย 100% (เรียกจาก startStage) · 'free' = คีบซ้ำจากปุ่ม 🎪 หน้าแผนที่ (1,000 บาท/ครั้ง)
function openS6Gacha(mode,doneNext){
 const old=document.querySelector('.s6g-modal');if(old)old.remove();
 window.__s6g={mode:mode||'free',busy:false,doneNext:doneNext||null};
 const s=eff();
 $('app').insertAdjacentHTML('beforeend',`<div class="modal s6g-modal"><div class="mbox s6g-box">
  <div class="s6g-cab">
   <div class="s6g-icons">${s6gIcons().map((ic,i)=>`<span class="s6g-ic" style="left:${6+((i*37)%88)}%;top:${8+((i*53)%78)}%;animation-delay:${(i%9)*.15}s">${ic}</span>`).join('')}</div>
   <div class="s6g-cow"><img src="Buff.webp" alt="" draggable="false" onerror="this.remove();this.parentNode.textContent='🐃'"></div>
   <div class="s6g-claw" id="s6gClaw">🪝</div>
  </div>
  <div class="s6g-bar">
   <span class="s6g-cost">${mode==='intro'?'🎁 ฟรี (ครั้งแรก)':'💰 '+baht(S6_GACHA_COST)}</span>
   <button class="btn-y" id="s6gPullBtn" onclick="s6gPull()" ${(mode!=='intro'&&(S.mp||0)<S6_GACHA_COST)?'disabled':''}>🕹 คีบ</button>
   ${mode==='intro'?'':'<button class="btn-g" onclick="s6gExit()">🚪 ออก</button>'}
  </div>
  <div class="s6g-stat">🐃 Luk รวม: ${s.luk} · คีบได้ควาย: ${S.story.s6GachaCow||0} ครั้ง</div>
 </div></div>`)}

function s6gPull(){
 const g=window.__s6g;if(!g||g.busy)return;
 if(g.mode!=='intro'){
  if((S.mp||0)<S6_GACHA_COST){s6gExit();return}   // เงินไม่พอ → ตัดกลับทันที ไม่ต้องแจ้งเตือน
  S.mp-=S6_GACHA_COST;save()}
 g.busy=true;
 const btn=document.getElementById('s6gPullBtn');if(btn)btn.disabled=true;
 const claw=document.getElementById('s6gClaw');if(claw)claw.classList.add('drop');
 TIMER=setTimeout(()=>{
  s6gResolve(g.mode==='intro'?{t:'cow'}:s6gRoll());
  if(claw)claw.classList.remove('drop');
  g.busy=false;
  const b2=document.getElementById('s6gPullBtn');if(b2)b2.disabled=(g.mode!=='intro'&&(S.mp||0)<S6_GACHA_COST)
 },450)}

function s6gResolve(res){
 const g=window.__s6g;if(!g)return;
 if(res.t==='cow'){
  S.st.luk=(S.st.luk||0)+1;S.story.s6GachaCow=(S.story.s6GachaCow||0)+1;
  showToast('🐃 ตุ๊กตาควาย! Luk +1 (ถาวร)','gold');save();
  if(g.mode==='intro'){
   S.story.s6GachaIntro=true;save();
   const done=g.doneNext;
   TIMER=setTimeout(()=>{
    const m=document.querySelector('.s6g-modal');if(m)m.remove();window.__s6g=null;
    showPostMatch(S6G_PRE3,()=>{if(done)done()},'s6gpre')
   },700);
   return}
  s6gRefresh();return}
 if(res.t==='none')return;   // 🧻 ทิชชู่ — ไม่แจ้งเตือน คีบต่อได้ทันที
 if(res.t==='item'){S.gearOwned.push(res.it.id);save();showToast('⚔️ ได้ '+res.it.icon+' '+res.it.n,'info');s6gRefresh();return}
 if(res.t==='legend'){S.gearOwned.push(res.it.id);save();showToast('🌟 ชะตาลิขิต','gold');s6gLegendLine();s6gRefresh();return}
 if(res.t==='dup')showToast('มีแล้ว','info')}

function s6gRefresh(){
 const box=document.querySelector('.s6g-box');if(!box)return;
 const s=eff();
 const cost=box.querySelector('.s6g-cost');if(cost&&window.__s6g&&window.__s6g.mode!=='intro')cost.textContent='💰 '+baht(S6_GACHA_COST);
 const stat=box.querySelector('.s6g-stat');if(stat)stat.textContent='🐃 Luk รวม: '+s.luk+' · คีบได้ควาย: '+(S.story.s6GachaCow||0)+' ครั้ง'}

// ✨ Easter Egg: คีบได้เกียร์ลับ (LEGEND 1%) — มายาโผล่พูดสั้นๆ แล้วหายไป
function s6gLegendLine(){
 const cab=document.querySelector('.s6g-cab');if(!cab)return;
 cab.insertAdjacentHTML('beforeend','<div class="s6g-legend"><img src="Maya5.webp" alt="" draggable="false" onerror="this.remove()"><p>ชะตาลิขิต...</p></div>');
 TIMER=setTimeout(()=>{const e=cab.querySelector('.s6g-legend');if(e)e.remove()},2200)}

function s6gExit(){
 const m=document.querySelector('.s6g-modal');if(m)m.remove();
 window.__s6g=null;
 if(R){R.busy=false;scrBattle()} else scrMapRender()}

let PM_DRAG=null;
function pmStored(){let o={};try{o=JSON.parse(localStorage.getItem(PM_POS_KEY)||'{}')||{}}catch(e){}return o}
function pmKey(slot){return (window.__pmScene||'pm')+'_'+slot}
const PM_LOCKED_POS={                                             // ค่าที่ล็อกไว้ต่อฉาก (คัดลอกจากตอนแก้ตำแหน่งจริง)
 s1pm_l:{dx:-5.125335693359375,dy:-19.359649658203125,sc:1.4},
 s1pm_c:{dx:7.879508972167969,dy:-11.246841430664062,sc:1.08},
 s1pm_r:{dx:34.862518310546875,dy:-42.0794677734375,sc:0.84},
 s2pm_l:{dx:90.84375,dy:148.39028930664062,sc:1.72},
 s2pm_c:{dx:0,dy:0,sc:1},
 s2pm_r:{dx:-81.54689025878906,dy:6.862579345703125,sc:1.08}};
function pmPos(slot){const o=pmStored(),k=pmKey(slot),v=o[k];return v||PM_LOCKED_POS[k]||{dx:0,dy:0,sc:1}}
function pmSetPos(slot,patch){
 const o=pmStored(),k=pmKey(slot);o[k]=Object.assign(pmPos(slot),patch);
 try{localStorage.setItem(PM_POS_KEY,JSON.stringify(o))}catch(e){}
 console.log('[PM_POS] '+k,o[k])}
function pmResetPos(){
 const o=pmStored();['l','c','r'].forEach(s=>delete o[pmKey(s)]);
 try{localStorage.setItem(PM_POS_KEY,JSON.stringify(o))}catch(e){}
 pmApplyPos()}
function pmCopyPos(){
 const o={};['l','c','r'].forEach(s=>o[s]=pmPos(s));
 const txt='['+(window.__pmScene||'pm')+'] '+JSON.stringify(o);
 const done=()=>showToast('📋 คัดลอกตำแหน่ง/ขนาดแล้ว! วางส่งในแชทได้เลย','gold');
 const fail=()=>{try{window.prompt('คัดลอกข้อความนี้ส่งในแชท:',txt)}catch(e){}};
 try{navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt).then(done).catch(fail):fail()}catch(e){fail()}}
function pmApplyPos(){
 const ov=document.querySelector('.pm-ov');if(!ov)return;
 ['l','c','r'].forEach(s=>{
  const slot=ov.querySelector('.pm-slot.'+s),im=slot&&slot.querySelector('.pm-port');if(!im)return;
  const p=pmPos(s);
  if(PM_EDIT){im.style.transform=`translate(${p.dx}px,${p.dy}px) scale(${p.sc})`;im.style.opacity=1}
  else{im.style.setProperty('--pmx',p.dx+'px');im.style.setProperty('--pmy',p.dy+'px');im.style.setProperty('--pms',p.sc)}});
 const box=ov.querySelector('.pm-box');
 if(box){const p=pmPos('box');box.style.transform=`translate(${p.dx}px,${p.dy}px) scale(${p.sc})`}}
function pmScaleBtn(slot){
 return PM_EDIT?`<div class="pm-sz" data-slot="${slot}"><button onclick="event.stopPropagation();pmNudgeScale('${slot}',-0.08)">➖</button><button onclick="event.stopPropagation();pmNudgeScale('${slot}',0.08)">➕</button></div>`:''}
function pmNudgeScale(slot,d){
 const p=pmPos(slot),sc=Math.max(.4,Math.min(2.2,+(p.sc+d).toFixed(2)));
 pmSetPos(slot,{sc});pmApplyPos()}
function pmDown(e,which){
 if(!PM_EDIT)return;
 let slot=which,target=e.currentTarget||e.target;
 if(!slot){const port=e.target.closest&&e.target.closest('.pm-port');if(!port)return;target=port;
  slot=port.closest('.pm-slot').classList.contains('l')?'l':port.closest('.pm-slot').classList.contains('r')?'r':'c'}
 e.stopPropagation();
 const p=pmPos(slot);
 PM_DRAG={slot,sx:e.clientX,sy:e.clientY,odx:p.dx,ody:p.dy,moved:false};
 try{target.setPointerCapture(e.pointerId)}catch(_){}
 window.addEventListener('pointermove',pmMove);window.addEventListener('pointerup',pmUp)}
function pmMove(e){
 if(!PM_DRAG)return;
 const dx=e.clientX-PM_DRAG.sx,dy=e.clientY-PM_DRAG.sy;
 if(!PM_DRAG.moved&&Math.hypot(dx,dy)<4)return;
 PM_DRAG.moved=true;window.__pmDragMoved=true;
 pmSetPos(PM_DRAG.slot,{dx:PM_DRAG.odx+dx,dy:PM_DRAG.ody+dy});
 pmApplyPos()}
function pmUp(){
 window.removeEventListener('pointermove',pmMove);window.removeEventListener('pointerup',pmUp);
 PM_DRAG=null}

function pmRender(){

 window.__pmAt=Date.now();
 const P=window.__pmIdx===0?(window.__pmPorts={l:null,c:null,r:null}):(window.__pmPorts||(window.__pmPorts={l:null,c:null,r:null}));
 ['l','c','r'].forEach(s=>{if(d[s]!==undefined)P[s]=d[s]});
 ['l','c','r'].forEach(s=>{
  const slot=ov.querySelector('.pm-slot.'+s),imgs=P[s],key=imgs?imgs.join('|'):'';

  const im=slot.firstElementChild;if(im){im.classList.toggle('dim',!!d.sp&&d.sp!==s);im.classList.toggle('tremble',!!d.shake&&d.sp===s)}});
 pmApplyPos();

 box.style.borderColor=(d.who&&!d.think)?'':'rgba(61,242,255,.35)';
 box.style.borderStyle=d.think?'dashed':'';
 box.dataset.anchor=d.sp||'c';                                   // หางบับเบิ้ลชี้ไปหาตัวละครที่พูด (l/c/r); ไม่ระบุ = กล่องกลางจอ
 const spkCol=(!d.who||d.who.indexOf(playerName())===0)?'#3df2ff':d.who.indexOf('มายา')===0?'#ff8ad8':d.who.indexOf('โจ')===0?'#ff9a3d':(d.who.indexOf('โค้ช')===0||d.who.indexOf('วิค')>=0)?'#ff334b':'';
 box.innerHTML=`<span class="spkname"${spkCol?` style="color:${spkCol}"`:''}>${nm}</span><p>${d.text}</p><div class="pm-tap">แตะหน้าจอเพื่อไปต่อ ▶</div>${PM_EDIT?`<div class="pm-grip" onpointerdown="event.stopPropagation();pmDown(event,'box')">⠿</div><div class="pm-sz pm-sz-box"><button onclick="event.stopPropagation();pmNudgeScale('box',-0.06)">➖</button><button onclick="event.stopPropagation();pmNudgeScale('box',0.06)">➕</button></div>`:''}`}
// กัมป์หอบ (Gump4.webp): วางหยดเหงื่อตามขนาดภาพจริงหลังภาพเลื่อนเข้าเสร็จ
function pmImgLoad(img){if(img.classList.contains('pant'))setTimeout(()=>pmSweat(img),450)}
function pmSweat(img){
 if(!img||!img.isConnected)return;
 const slot=img.parentElement;if(!slot)return;
 slot.querySelectorAll('.pm-sw').forEach(x=>x.remove());
 const s=slot.getBoundingClientRect(),r=img.getBoundingClientRect();
 if(!r.width)return;
 [[.34,.20,0],[.70,.19,.45],[.32,.26,.9],[.68,.25,.2]].forEach(a=>slot.insertAdjacentHTML('beforeend',
  `<i class="pm-sw" style="left:${(r.left-s.left+r.width*a[0]).toFixed(0)}px;top:${(r.top-s.top+r.height*a[1]).toFixed(0)}px;animation-delay:${a[2]}s"></i>`))}
function pmImgFail(img){
 const a=(img.dataset.alt||'').split('|').filter(Boolean);
 if(a.length){img.dataset.alt=a.slice(1).join('|');img.src=a[0]}else img.remove()}
function pmTap(){
 if(window.__pmDragMoved){window.__pmDragMoved=false;return}
 if(Date.now()-(window.__pmAt||0)<280)return;      // กันแตะรัวข้ามบทโดยไม่ตั้งใจ
 window.__pmIdx++;
 if(window.__pmIdx>=(window.__pmScript||[]).length){
  const ov=document.querySelector('.pm-ov');if(ov)ov.remove();
  const n=window.__pmNext;window.__pmNext=null;if(n)n();return}
 pmRender()}

 if(itemOwned('goldglove'))R.reveal=true;

 if(i!==ENDLESS_IDX)S.stats.bestStage=Math.max(S.stats.bestStage||0,i+1);
 if(S.dopeDebt>0){R.penalty=6;S.dopeDebt=0;save();log('ผลข้างเคียงยาโดป: ทุกสเตต −6 ในด่านนี้','bad')}
 R.hp=maxHp();R.pulseMaxRef=R.hp;
 if(S.legendActive==='kaiPulse')log('💓 KAI Pulse Link: HP สูงสุดลดเหลือ '+R.hp+' — ยิ่งใกล้ตายยิ่งแกร่ง!','bad');
 if(S.legendActive==='rightleg')log('🦵 ขาขวาโอเวอร์ไดรฟ์: STR ทะลุเพดาน! (ปิดกั้น Gold/EXP)','bad');
 log(i===ENDLESS_IDX?'♾️ เริ่ม Endless — HP '+R.hp:'🏟 เริ่มด่าน '+(i+1)+' : '+STAGES[i].n+' — HP '+R.hp,'gold');
scrBattle();
if(i===1&&s2PreNeeded()){R.busy=true;showS2Pre(()=>{if(R)drawCards()},S2_PRE,()=>s1Mark('s2_pre'),{pfx:'s2_',edit:S2_PRE_EDIT,tag:'S2_PRE_POS'})}   // ด่าน 2 รอบแรก: คัตซีน Pick.webp → ขึ้นเลือกแผนต่อทันที

else if(i===3&&s4PreNeeded()){R.busy=true;showS4Pre(()=>{if(R)drawCards()})}   // ด่าน 3 รอบแรก: คัตซีน Pick.webp (มีปุ่มข้าม) → ขึ้นเลือกแผนต่อทันที
else if(i===4&&s5PreNeeded()){R.busy=true;showS5Pre(()=>{if(R)drawCards()})}   // ด่าน 5 รอบแรก: คัตซีน Troom.webp (ลากกล่องข้อความได้) → ขึ้นเลือกแผนต่อทันที
else if(i===5&&!S.story.s6GachaIntro){R.busy=true;showPostMatch(S6G_PRE1,()=>showPostMatch(S6G_PRE2,()=>openS6Gacha('intro',()=>{if(R)drawCards()}),'s6gzoom'),'s6gpre')}   // ด่าน 6 รอบแรก: บทนำ + ตู้คีบตุ๊กตา (บังคับได้ควาย 100%) → ปลดล็อกปุ่ม 🎪 → เข้าเกม
else drawCards();

function endlessRoundClear(){
 const done=R.round+1,next=()=>{

  log('♾️ ผ่านครบ '+(done*10)+' กองหลัง! เข้ารอบที่ '+(done+1)+(heal?' · HP +'+heal:''),'gold');
  R.busy=false;R.scene='travel';encounter()};
 if(!farmBlocked()){R.earned+=CFG.CLEAR;gainExp(CFG.CLEAR)}

 const p=Math.min(1,(performance.now()-ZC.t0)/ZC_MS);
 document.querySelectorAll('.zc-btn').forEach(b=>{b.style.setProperty('--zc',(p*100).toFixed(1));b.classList.toggle('max',p>=1)});

 if(pt){

function zcUp(e){

  return winClash('TEC',fin?'ZERO CANNON 100%!':ACTIONS.TEC.win,fin?'บอลระเบิดพุ่งตุงตาข่าย!':'ชาร์จเต็ม MAX · อัดระยะประชิด',ACTIONS.TEC.fx,{charged:true})}

 const drift=(k==='DRB'&&full===true&&driftOn()),charged=(k==='TEC'&&full===true)||drift,c=calc(k,charged),s=eff(),a=ACTIONS[k];

 // === CARD: 🔁 วัน-ทู — consume tactic buff ก่อนทอย ===
 const hadTactic = R.tacticActive;
 if(hadTactic) R.tacticActive = false;

 if(!isRetry){if(R.lastAct===k)R.streak++;else{R.lastAct=k;R.streak=1};R.bestRunStreak=Math.max(R.bestRunStreak||0,R.streak);if(!eIsGK()&&ACTIONS[k].adv===curEnemy().type)R.advWins++}
 if(R.devil){const d=Math.max(1,Math.round(maxHp()*.02));damageByCard(d);log('😈 สัญญาปีศาจ: −'+d+' HP','bad');}

 }
 
 const proc=s.luk/CFG.LUCK_P+R.procBonus;
 if(!R.coinFlip&&Math.random()*100<proc){R.procMiss=0;log('🍀 Lucky Proc! ('+proc.toFixed(1)+'%) ผ่าน 100%','gold');
  if(k==='DRB' && R.aceDRB) applyAcePenalty();   // 🃏 Lucky ก็นับ

log('🐴 เกือกม้าอาถรรพ์สวนกลับ! −'+d+' HP','bad');}}
 const roll=Math.random()*100;
 log(`${a.i} ${a.n}${drift?' (Shadow Drift +'+SD_BONUS+'%)':charged?' (ชาร์จ MAX +'+ZC_BONUS+'%)':''} → โอกาส ${c.chance}% | ทอย ${roll.toFixed(1)}`,'info');
 if(k==='DRB' && R.aceDRB) applyAcePenalty();   // 🃏 ใช้แล้วติดโทษ
 if(roll<c.chance){log('✅ ผ่านกองหลังไปได้!','ok');winClash(k,drift?'SHADOW DRIFT!':a.win,(drift?'Perfect Drift · ':charged?'ชาร์จเต็ม MAX · ':'')+a.n+' สำเร็จ',a.fx,{charged,drift})}
 else{if(R.retry>0&&!isRetry)return askRetry(k);loseClash(k)}}

function winClash(actKey,txt,sub,fx,opt){

 const wasZero=isZeroStep()||isZeroFinale();      // ด่าน 3: ยิง ZERO CANNON ครั้งแรก / ฉากจบดวล GK

 if(actKey==='PWD'){R.curPwdStreak=(R.curPwdStreak||0)+1;R.maxPwdStreak=Math.max(R.maxPwdStreak||0,R.curPwdStreak)}else R.curPwdStreak=0;
 if(R.hp<maxHp()*.2)R.everLowHpWin=true;

 // === CARD: ⚽ ครบสูตร — นับท่าชนะทางที่ใช้สำเร็จ ===
 if(R.totalFootball && !R.tfDone && !eIsGK()){
   const aInfo = ACTIONS[actKey];
   if(aInfo && aInfo.adv === curEnemy().type){
     R.tfUsed = R.tfUsed || {};
     R.tfUsed[actKey] = true;
     if(Object.keys(R.tfUsed).length >= 3){
       R.tfDone = true;
       const h = Math.round(maxHp() * .20);
       R.hp = Math.min(maxHp(), R.hp + h);
       log('⚽ ครบสูตร! ใช้ท่าชนะทางครบ 3 แบบ → ฮีล ' + h + ' HP','gold');
     }
   }
 }

 // === CARD: 🔁 วัน-ทู — ชนะด้วยท่าชนะทาง → เซ็ตบัฟให้ท่าถัดไป ===
 if(R.tacticSwitch && !eIsGK() && ACTIONS[actKey] && ACTIONS[actKey].adv === curEnemy().type){
   R.tacticActive = true;
 }

 // === CARD: ⚡ สวนกลับ — ผ่านแล้วเคลียร์ flag ===
 R.lastActMissed = false;

 R.missStreak=0;
const prevTier=streakTier(R.winStreak||0);R.winStreak=(R.winStreak||0)+1;const nowTier=streakTier(R.winStreak);
 R.bestRunStreak=Math.max(R.bestRunStreak||0,R.winStreak);S.stats.bestStreak=Math.max(S.stats.bestStreak||0,R.winStreak);
 R.taunt=null;
 R.driftFx=!!(opt&&opt.drift);

 if(nowTier>prevTier){playBass(nowTier);navigator.vibrate?.([0,20,30,60]);
  log('🔥 STREAK ×'+R.winStreak+'! EXP +'+CFG.STREAK_BON[nowTier-1]+'%','gold')}
 setTimeout(()=>{if(!R||R.over)return;R.flash={t:txt,s:sub,c:fx||'f-pass'};

   spawnFX((opt&&opt.drift)?'drift':actKey==='PWD'?'pwr':actKey==='TEC'?'rbw':actKey==='HLS'?'spin':'pass')}},({PWD:400,TEC:360}[actKey]||520));

function onPass(){
 if(R.hp<=0){R.busy=false;return endRun()}
 if(R.phase==='gk'){R.coinFlip=false;return R.endless?endlessRoundClear():winStage()}

function claimGift(idx){
 const queue = R && R.giftQueue ? R.giftQueue : [];
 const it = queue[idx];
 if(it && !itemOwned(it.id)){
  S.gearOwned.push(it.id);
  if(it.rarity==='epic' && R){
   if(it.id==='goldglove') R.reveal=true;
   if(it.id==='dragon')    R.shield=(R.shield||0)+1;
   if(it.id==='lightning') R.retry=(R.retry||0)+1;
   if(it.id==='ring')      R.procBonus=(R.procBonus||0)+5;
  }
  let autoActivated=false;
  if(it.rarity==='legend'){
   if(!S.legendActive){ // ยังไม่มีชิ้นไหนใช้งานอยู่ → เปิดใช้งานให้อัตโนมัติ
    S.legendActive=it.id;autoActivated=true;
    if(R){const newMax=maxHp();R.hp=Math.min(R.hp,newMax);R.pulseMaxRef=newMax}
   }
  }
  save();
  log((it.rarity==='legend'?'🌟 เก็บ ':'🎁 เก็บ ')+it.icon+' '+it.n+' เข้าหอเกียรติยศแล้ว'+(autoActivated?' และเปิดใช้งานอัตโนมัติ':(it.rarity==='legend'?' (ไปเปิดใช้งานได้ที่หอเกียรติยศ)':'')),'gold');
  showToast((it.rarity==='legend'?'🌟 ปลดล็อกไอเทมลับ ':'💎 เก็บ ')+it.n+'!','complete');
 }
 const m = document.querySelector('.modal');
 if(m) m.remove();
 showGiftModal(idx+1);
}

function playIntroVideo() {
  const old = document.getElementById('introVideoScreen');
  if (old) old.remove();

  document.body.insertAdjacentHTML('beforeend', `
  <div id="introVideoScreen" class="video-screen">
    <video id="introVideo" autoplay muted playsinline preload="auto">
      <source src="./V1.mp4" type="video/mp4">
    </video>
    <button class="video-skip" onclick="afterIntroVideo()">ข้าม ▶</button>
  </div>`);

  const v = document.getElementById('introVideo');

  // ถ้าวีดีโอเล่นจบ → ไปต่ออัตโนมัติ
  v.addEventListener('ended', afterIntroVideo);

  // ถ้าโหลดวีดีโอไม่ได้ → ข้ามไปเลย
  v.addEventListener('error', () => {
    console.warn('โหลด V1.mp4 ไม่สำเร็จ — ข้ามวีดีโอ');
    afterIntroVideo();
  });

  // Safety timeout 15 วิ (กันค้าง)
  window.__introVideoTimer = setTimeout(afterIntroVideo, 15000);

  // พยายามเล่นแบบมีเสียง (ถ้า browser บล็อก → เล่นแบบ mute แทน)
  v.muted = false;
  v.volume = 1;
  const p = v.play();
  if (p && p.catch) {
    p.catch(() => { v.muted = true; v.play().catch(()=>{}); });
  }
}

function afterIntroVideo() {

}

let caStep = -1;

const CHAR_COLOR={jo:'#ff9a3d',maya:'#ff8ad8',gump:'#3df2ff',coach:'#ff334b',neutral:'#d4af37'};   // สีประจำตัวละคร: โจ=ส้ม มายา=ชมพู กัมป์=ฟ้า โค้ช=แดง ใช้ทั้งกล่องข้อความหลักและบับเบิ้ลลอย
function openCutsceneCa11() {
  caStep = -1;
  const con = document.getElementById('ca11CutsceneContainer');
  if (con) con.style.display = 'flex';
  const spk = document.getElementById('caSpeaker');
  const txt = document.getElementById('caText');

  if (txt) txt.innerText = '​ณ ม้านั่งสำรอง ข้างสนามฝึกซ้อม...';

function handleCaTap() {
  caStep++;
  if (caStep >= scriptCa11.length) {
    const con = document.getElementById('ca11CutsceneContainer');
    if (con) con.style.display = 'none';
    openCutsceneCa12();
    return;
  }

  const current = scriptCa11[caStep];
  const viewport = document.getElementById('caViewport');
  const fieldBubble = document.getElementById('caField');
  const fieldAvatar = document.getElementById('caAvatar');
  const fieldContent = document.getElementById('caFieldContent');
  const cutinCoach = document.getElementById('caCutin');
    const coachBubble = document.getElementById('caCoachBubble');
  const coachText = document.getElementById('caCoachText');
  const sfxWhistle = document.getElementById('caWhistle');
  const bubbleMaya = document.getElementById('caBubbleMaya');
  const bubbleGum = document.getElementById('caBubbleGum');
  const charGum = document.getElementById('caCharGum');
  const sweatDrop = document.getElementById('caSweat');
  const speakerEl = document.getElementById('caSpeaker');
  const textEl = document.getElementById('caText');

  if (fieldBubble) fieldBubble.style.display = 'none';
  if (fieldAvatar) fieldAvatar.style.display = 'none';
  if (cutinCoach) cutinCoach.classList.remove('active');
    if (coachBubble) coachBubble.style.display = 'none';
  if (sfxWhistle) sfxWhistle.classList.remove('active');
  if (bubbleMaya) bubbleMaya.classList.remove('active');
  if (bubbleGum) bubbleGum.classList.remove('active');
  if (charGum) charGum.classList.remove('scared');
  if (sweatDrop) sweatDrop.classList.remove('active');
  if (textEl) {
    textEl.style.fontStyle = 'normal';
    textEl.style.color = '#eaeaea';
  }
  const dlgBox = document.getElementById('caDialogueBox');
  if (dlgBox) dlgBox.style.borderColor = CHAR_COLOR.neutral;      // ค่าเริ่มต้น: กล่องบรรยากาศ/narration สีกลาง
  if (dlgBox) dlgBox.style.minHeight = current.fit ? 'auto' : '';   // fit:true = ย่อกล่องให้พอดีความยาวข้อความ (ใช้กับประโยคสั้นๆ)
  if (speakerEl) speakerEl.style.color = CHAR_COLOR.neutral;

    if (current.mode === 'field') {
    if (current.avatar && fieldAvatar) {
      fieldAvatar.src = current.avatar;
      fieldAvatar.style.display = 'block';
    }
    if (fieldContent) {
      fieldContent.innerHTML = 
        '<span class="field-speaker-tag">◀ [' + current.name + ']</span>' +
        '<span class="field-shout-text">"' + current.text + '"</span>';
    }
    if (fieldBubble) fieldBubble.style.display = 'flex';
    if (current.name === 'โจ' && dlgBox) { dlgBox.style.borderColor = CHAR_COLOR.jo; if (speakerEl) speakerEl.style.color = CHAR_COLOR.jo; }
    if (speakerEl) speakerEl.innerText = 'บรรยากาศในสนาม';
    if (textEl) textEl.innerText = 'เสียงตะโกนของ ' + current.name + ' ดังข้ามม้านั่งมา...';
  } else if (current.mode === 'coach') {
    if (dlgBox) dlgBox.style.borderColor = CHAR_COLOR.coach;
    if (speakerEl) speakerEl.style.color = CHAR_COLOR.coach;
    if (cutinCoach) cutinCoach.classList.add('active');
    if (viewport) {
      viewport.classList.add('shake');
      setTimeout(function() { viewport.classList.remove('shake'); }, 350);
    }
    if (charGum) charGum.classList.add('scared');
    if (sweatDrop) sweatDrop.classList.add('active');

    // สั่งให้กล่องข้อความสีแดงเด้งขึ้นมาบนตาโค้ช
    if (coachBubble && coachText) {
      coachText.innerHTML = '"' + current.text + '"';
      coachBubble.style.display = 'block';
    }
    if (speakerEl) speakerEl.innerText = current.name;
    if (textEl) textEl.innerText = current.text;
   } else if (current.mode === 'talk_maya') {
    if (dlgBox) dlgBox.style.borderColor = CHAR_COLOR.maya;
    if (speakerEl) speakerEl.style.color = CHAR_COLOR.maya;
    if (bubbleMaya) {
      bubbleMaya.innerText = current.text;
      bubbleMaya.classList.add('active');
    }
    // ถ้าเป็นประโยคแรกของมายา (caStep === 3) ให้กัมป์ยังคงสั่นกลัวและเหงื่อตกอยู่
    if (caStep === 3) {
      if (charGum) charGum.classList.add('scared');
      if (sweatDrop) sweatDrop.classList.add('active');
    }
    if (speakerEl) speakerEl.innerText = current.name;
    if (textEl) textEl.innerText = '"' + current.text + '"';
  }
    else if (current.mode === 'talk_gum') {
    if (dlgBox) dlgBox.style.borderColor = CHAR_COLOR.gump;
    if (speakerEl) speakerEl.style.color = CHAR_COLOR.gump;
    if (bubbleGum) {
      bubbleGum.innerText = current.text;
      bubbleGum.classList.add('active');
    }
    if (speakerEl) speakerEl.innerText = current.name;
    if (textEl) textEl.innerText = '"' + current.text + '"';
  } else if (current.mode === 'narration') {
    if (sfxWhistle) sfxWhistle.classList.add('active');
    if (viewport) {
      viewport.classList.add('shake');
      setTimeout(function() { viewport.classList.remove('shake'); }, 250);
    }
    if (speakerEl) speakerEl.innerText = '';
    if (textEl) {
      textEl.innerText = current.text;
      textEl.style.fontStyle = 'italic';
      textEl.style.color = '#aaa';
    }
  } else if (current.mode === 'end') {
    if (speakerEl) speakerEl.innerText = current.name;
    if (textEl) textEl.innerText = current.text;
  }
}

let c12Step = -1;

/* ---- Ca12 EDIT MODE: ลากย้ายตำแหน่ง/ปรับขนาดตัวละคร+กล่องข้อความ (เก็บพิกัดไว้ใน localStorage) ---- */
const C12_EDIT = false;                                           // ล็อกแล้วตามพิกัดที่ส่งมา (true = ลากตัวละคร/บับเบิ้ล/กล่องข้อความ + ปุ่ม ➕➖ ปรับขนาดได้อีกครั้งถ้าต้องแก้ต่อ)
const C12_POS_KEY = 'striker_c12_pos_v1';
const C12_EL_ID = { coach:'c12CoachPose', maya:'c12MayaPose', gum:'c12GumPose', box:'c12DialogueBox', bcoach:'c12BubbleCoachPos', bmaya:'c12BubbleMayaPos', bgum:'c12BubbleGumPos' };
const C12_LOCKED_POS = {                                          // ค่าที่ล็อกไว้ (คัดลอกจากตอนแก้ตำแหน่งจริง) — ตัวละคร/กล่องข้อความอยู่ตำแหน่งเดิม มีแค่บับเบิ้ลคำพูด 3 อันที่ขยับ/ขยาย
  coach:{dx:0,dy:0,sc:1}, maya:{dx:0,dy:0,sc:1}, gum:{dx:0,dy:0,sc:1}, box:{dx:0,dy:0,sc:1},
  bcoach:{dx:85.44026947021484,dy:60.16632843017578,sc:1.48},
  bmaya:{dx:-93.553466796875,dy:-27.00937271118164,sc:1.4},
  bgum:{dx:-79.50242614746094,dy:33.67154312133789,sc:1.32}
};
let C12_DRAG = null;
function c12Stored(){ let o={}; try{ o=JSON.parse(localStorage.getItem(C12_POS_KEY)||'{}')||{} }catch(e){} return o; }
function c12Pos(key){ const o=c12Stored(); return o[key]||C12_LOCKED_POS[key]||{dx:0,dy:0,sc:1}; }
function c12SetPos(key,patch){
  const o=c12Stored(); o[key]=Object.assign(c12Pos(key),patch);
  try{ localStorage.setItem(C12_POS_KEY,JSON.stringify(o)); }catch(e){}
}
function c12ApplyPos(){
  Object.keys(C12_EL_ID).forEach(key=>{
    const el=document.getElementById(C12_EL_ID[key]); if(!el) return;
    const p=c12Pos(key);
    el.style.transform = 'translate('+p.dx+'px,'+p.dy+'px) scale('+p.sc+')';
  });
}
function c12ResetPos(){
  try{ localStorage.removeItem(C12_POS_KEY); }catch(e){}
  c12ApplyPos();
}
function c12CopyPos(){
  const o={}; Object.keys(C12_EL_ID).forEach(key=>o[key]=c12Pos(key));
  const txt='[Ca12] '+JSON.stringify(o);
  const done=()=>{ if(typeof showToast==='function') showToast('📋 คัดลอกตำแหน่ง/ขนาดแล้ว! วางส่งในแชทได้เลย','gold'); };
  const fail=()=>{ try{ window.prompt('คัดลอกข้อความนี้ส่งในแชท:',txt); }catch(e){} };
  try{ navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(txt).then(done).catch(fail) : fail(); }catch(e){ fail(); }
}
function c12Down(e,key){
  if(!C12_EDIT) return;
  e.stopPropagation();
  const p=c12Pos(key);
  C12_DRAG={key,sx:e.clientX,sy:e.clientY,odx:p.dx,ody:p.dy,moved:false};
  const el=document.getElementById(C12_EL_ID[key]); if(el) el.classList.add('c12-dragging');
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
  window.addEventListener('pointermove',c12Move);
  window.addEventListener('pointerup',c12Up);
}
function c12Move(e){
  if(!C12_DRAG) return;
  const dx=e.clientX-C12_DRAG.sx, dy=e.clientY-C12_DRAG.sy;
  if(!C12_DRAG.moved && Math.hypot(dx,dy)<4) return;
  C12_DRAG.moved=true; window.__c12DragMoved=true;
  c12SetPos(C12_DRAG.key,{dx:C12_DRAG.odx+dx,dy:C12_DRAG.ody+dy});
  c12ApplyPos();
}
function c12Up(){
  window.removeEventListener('pointermove',c12Move);
  window.removeEventListener('pointerup',c12Up);
  if(C12_DRAG){ const el=document.getElementById(C12_EL_ID[C12_DRAG.key]); if(el) el.classList.remove('c12-dragging'); }
  C12_DRAG=null;
}
function c12NudgeScale(key,d){
  const p=c12Pos(key), sc=Math.max(.4,Math.min(2.2,+(p.sc+d).toFixed(2)));
  c12SetPos(key,{sc}); c12ApplyPos();
}

function setSpeakerCa12(activeChar) {
  const coach = document.getElementById('c12CoachImg');
  const maya = document.getElementById('c12MayaImg');
  const gum = document.getElementById('c12GumImg');
  if (!coach || !maya || !gum) return;

  coach.className = 'silent';
  maya.className = 'silent';
  gum.className = 'silent';

  if (activeChar === 'coach') coach.className = 'speaking';
  else if (activeChar === 'maya') maya.className = 'speaking';
  else if (activeChar === 'gum') gum.className = 'speaking';
  else if (activeChar === 'all') {
    coach.className = '';
    maya.className = '';
    gum.className = '';
  }
}

      gumImg.src = 'Gump122.webp';
      gumImg.style.setProperty('transform', 'scaleX(1)', 'important');
      gumImg.classList.add('c12-glow');
    }
    if (gumBox) {
      gumBox.style.width = '70%';
      gumBox.style.bottom = '-2%';
      gumBox.style.right = '12.5%';
    }
    if (c12Box) c12Box.style.borderColor = CHAR_COLOR.gump;
    if (spk) { spk.innerText = cur.name; spk.style.color = CHAR_COLOR.gump; }
    if (txt) txt.innerText = '"' + cur.text + '"';
    if (bubGum) { bubGum.innerText = cur.text; bubGum.classList.add('active'); }
  }
  else if (cur.mode === 'maya_happy') {
    setSpeakerCa12('maya');
    if (c12Box) c12Box.style.borderColor = CHAR_COLOR.maya;
    const mayaImg = document.getElementById('c12MayaImg');
    const sparkles = document.getElementById('c12Sparkles');
    if (mayaImg) mayaImg.classList.add('c12-bounce');
    if (sparkles) sparkles.classList.add('active');
    if (spk) { spk.innerText = cur.name; spk.style.color = CHAR_COLOR.maya; }
    if (txt) txt.innerText = '"' + cur.text + '"';
    if (bubMaya) { bubMaya.innerText = cur.text; bubMaya.classList.add('active'); }
  }
  else if (cur.mode === 'system') {
    setSpeakerCa12('all');
    if (spk) { spk.innerText = cur.name; spk.style.color = '#3df2ff'; }
    if (txt) { txt.innerText = cur.text; txt.style.color = '#3df2ff'; txt.style.fontWeight = 'bold'; }
  }
}
</script>
</body>
</html>
